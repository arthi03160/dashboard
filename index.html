<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <title>StandBy 4S Emoji</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a2a3a 0%, #0d1217 70%, #050505 100%);
            color: #ffffff; font-family: 'Archivo Black', sans-serif; overflow: hidden;
        }
        #wrapper { display: flex; width: 200%; height: 100%; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .page { width: 50%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }

        /* Page 1 : Horloge */
        #clock { font-size: 85px; line-height: 1; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #date { font-size: 16px; color: #a0aab4; margin-top: 10px; text-transform: uppercase; }

        /* Page 2 : Météo Widgets */
        .widget-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 92%; }
        .widget {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px; padding: 12px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .w-main { grid-column: 1 / 2; }
        .w-precip { grid-column: 2 / 3; }
        .w-forecast { grid-column: 1 / 3; }

        .emoji-icon { font-size: 38px; margin-bottom: 5px; }
        .temp-now { font-size: 32px; line-height: 1; }
        .widget-label { font-size: 9px; color: #888; text-transform: uppercase; margin-bottom: 4px; }
        .precip-val { font-size: 20px; color: #3498db; }

        .forecast-list { display: flex; width: 100%; justify-content: space-around; }
        .f-day { font-size: 9px; color: #aaa; }
        .f-day b { display: block; font-size: 13px; color: #fff; margin-top: 2px; }

        #dots { position: fixed; bottom: 8px; width: 100%; text-align: center; }
        .dot { display: inline-block; width: 7px; height: 7px; background: rgba(255,255,255,0.2); border-radius: 50%; margin: 0 4px; }
        .active { background: #3498db; }
        .city-tag { font-size: 8px; color: #444; margin-top: 8px; letter-spacing: 1px; }
    </style>
</head>
<body onclick="togglePage()">

    <div id="wrapper">
        <div class="page">
            <div id="clock">00:00</div>
            <div id="date">-- --- ----</div>
        </div>

        <div class="page">
            <div class="widget-grid">
                <div class="widget w-main">
                    <span class="widget-label">Météo</span>
                    <div id="emoji-main" class="emoji-icon">☀️</div>
                    <div class="temp-now" id="temp">--°</div>
                </div>
                <div class="widget w-precip">
                    <span class="widget-label">Pluie</span>
                    <div class="emoji-icon">☔</div>
                    <div class="precip-val" id="precip">0%</div>
                </div>
                <div class="widget w-forecast">
                    <span class="widget-label" style="margin-bottom: 8px;">Prévisions</span>
                    <div class="forecast-list" id="forecast"></div>
                </div>
            </div>
            <div class="city-tag">CASTANET-TOLOSAN</div>
        </div>
    </div>

    <div id="dots"><div class="dot active" id="d1"></div><div class="dot" id="d2"></div></div>

    <script>
        function updateClock() {
            var now = new Date();
            var h = now.getHours(), m = now.getMinutes();
            document.getElementById('clock').innerHTML = (h<10?'0':'')+h + ":" + (m<10?'0':'')+m;
            document.getElementById('date').innerHTML = now.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
        }
        setInterval(updateClock, 1000); updateClock();

        var currentPage = 1;
        function togglePage() {
            var w = document.getElementById('wrapper');
            currentPage = (currentPage === 1 ? 2 : 1);
            w.style.transform = "translateX(" + (currentPage === 1 ? "0" : "-50") + "%)";
            document.getElementById('d1').className = "dot" + (currentPage===1?" active":"");
            document.getElementById('d2').className = "dot" + (currentPage===2?" active":"");
        }

        function getMeteo() {
            fetch('https://api.open-meteo.com/v1/forecast?latitude=43.5157&longitude=1.5159&daily=temperature_2m_max,weathercode,precipitation_probability_max&current_weather=true&timezone=Europe%2FParis')
            .then(res => res.json()).then(data => {
                document.getElementById('temp').innerHTML = Math.round(data.current_weather.temperature) + "°";
                document.getElementById('precip').innerHTML = data.daily.precipitation_probability_max[0] + "%";
                
                // Logique Emoji simple
                var code = data.current_weather.weathercode;
                var emoji = "☀️";
                if(code > 0 && code <= 3) emoji = "🌤️";
                if(code > 3 && code < 60) emoji = "☁️";
                if(code >= 60) emoji = "🌧️";
                if(code >= 71) emoji = "❄️";
                if(code >= 95) emoji = "⚡";
                document.getElementById('emoji-main').innerHTML = emoji;

                var days = ['DIM', 'LUN', 'MAR', 'MER', 'JEU', 'VEN', 'SAM'];
                var html = "";
                for(var i=1; i<=4; i++) {
                    var d = new Date(); d.setDate(d.getDate() + i);
                    html += "<div class='f-day'>" + days[d.getDay()] + "<b>" + Math.round(data.daily.temperature_2m_max[i]) + "°</b></div>";
                }
                document.getElementById('forecast').innerHTML = html;
            });
        }
        getMeteo(); setInterval(getMeteo, 600000);
    </script>
</body>
</html>
