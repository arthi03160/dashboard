<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Réveil iPhone 4S</title>
    <style>
        body {
            background-color: #000;
            color: white;
            font-family: -apple-system, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        #clock {
            font-size: 60px;
            font-weight: 200;
            margin-bottom: 20px;
        }

        .setup {
            background: #1c1c1e;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            width: 80%;
            max-width: 300px;
        }

        input[type="time"] {
            background: #2c2c2e;
            border: none;
            color: white;
            font-size: 30px;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            width: 100%;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            cursor: pointer;
        }

        .btn-off { background-color: #3a3a3c; color: #ff3b30; }
        .btn-on { background-color: #30d158; color: white; }

        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #8e8e93;
        }
    </style>
</head>
<body>

    <div id="clock">00:00:00</div>

    <div class="setup">
        <input type="time" id="alarmTime" value="07:00">
        <button id="alarmBtn" class="btn-off" onclick="toggleAlarm()">ALARME : OFF</button>
        <div id="status">Désactivée</div>
    </div>

    <audio id="alarm-sound" loop>
        <source src="alarm.mp3" type="audio/mpeg">
    </audio>

    <script>
        let alarmActive = false;
        const clockElement = document.getElementById('clock');
        const alarmTimeInput = document.getElementById('alarmTime');
        const alarmBtn = document.getElementById('alarmBtn');
        const statusElement = document.getElementById('status');
        const audio = document.getElementById('alarm-sound');

        // Mise à jour de l'horloge
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            
            clockElement.innerText = h + ":" + m + ":" + s;

            // Vérification de l'alarme
            if (alarmActive) {
                const currentTime = h + ":" + m;
                if (currentTime === alarmTimeInput.value && s === "00") {
                    audio.play().catch(e => console.log("Erreur lecture :", e));
                    statusElement.innerText = "🔔 RÉVEIL EN COURS !";
                }
            }
        }

        function toggleAlarm() {
            if (!alarmActive) {
                // ACTIVER
                alarmActive = true;
                alarmBtn.innerText = "ALARME : ON";
                alarmBtn.className = "btn-on";
                statusElement.innerText = "Réveil réglé sur " + alarmTimeInput.value;
                
                // Indispensable sur iPhone : déverrouille l'audio sur le clic
                audio.play();
                audio.pause();
                audio.currentTime = 0;
            } else {
                // DÉSACTIVER (Arrête le son si il joue)
                alarmActive = false;
                alarmBtn.innerText = "ALARME : OFF";
                alarmBtn.className = "btn-off";
                statusElement.innerText = "Désactivée";
                audio.pause();
                audio.currentTime = 0;
            }
        }

        setInterval(updateClock, 1000);
    </script>
</body>
</html>
