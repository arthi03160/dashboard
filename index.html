<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icone.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    
    <title>StandBy 4S - Master Framework</title>
    
    <style>
        /* =====================================================================
           1. RESET ET CONFIGURATION DE BASE
           =====================================================================
        */
        * {
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        /* Réactivation de la sélection pour les réglages de l'alarme */
        input { 
            -webkit-user-select: auto !important; 
            user-select: auto !important; 
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #ffffff;
            font-family: 'Archivo Black', Arial, sans-serif;
            overflow: hidden;
            position: fixed;
        }

        /* =====================================================================
           2. SYSTÈME DE FOND DYNAMIQUE (FIX IPHONE 4S)
           =====================================================================
        */
        #dynamic-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* IMPORTANT : Utiliser des images de 960x640px 
               pour ne pas saturer la RAM de l'iPhone 4S.
            */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            /* Transition de fondu entre le jour et la nuit */
            -webkit-transition: background-image 2.0s ease-in-out;
            transition: background-image 2.0s ease-in-out;
            z-index: -1;
        }

        /* OVERLAY DE CONTRASTE 
           Réduit à 0.25 pour plus de luminosité sur tes photos.
        */
        #bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            z-index: 0;
        }

        /* =====================================================================
           3. STRUCTURE DES PAGES ET TRANSITIONS
           =====================================================================
        */
        #wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            -webkit-perspective: 1000px;
            perspective: 1000px;
            z-index: 10;
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            
            /* Effet d'échelle pour l'animation Ubuntu */
            -webkit-transform: scale(1.1);
            transform: scale(1.1);
            
            /* Courbe de transition fluide */
            -webkit-transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            pointer-events: none;
        }

        .active-page {
            opacity: 1 !important;
            visibility: visible !important;
            -webkit-transform: scale(1) !important;
            transform: scale(1) !important;
            pointer-events: auto;
        }

        /* Animations de sortie (Slide out) */
        .exit-left {
            -webkit-transform: scale(0.8) translateX(-120%) !important;
            transform: scale(0.8) translateX(-120%) !important;
            opacity: 0 !important;
        }

        .exit-right {
            -webkit-transform: scale(0.8) translateX(120%) !important;
            transform: scale(0.8) translateX(120%) !important;
            opacity: 0 !important;
        }

        /* =====================================================================
           4. DESIGN DES WIDGETS (OPACITÉ ET FLOU)
           =====================================================================
        */
        #clock {
            font-size: 82px;
            line-height: 1;
            /* Ombre portée forte pour contrer le fond lumineux */
            text-shadow: 0 5px 35px rgba(0,0,0,1);
            letter-spacing: -2px;
        }

        #date {
            font-size: 16px;
            color: #ffffff;
            margin-top: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 2px 12px rgba(0,0,0,1);
        }

        .widget-box {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            padding: 15px;
            width: 85%;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            /* Effet de flou (Actif sur iOS 9) */
            -webkit-backdrop-filter: blur(10px);
        }

        .alarm-card {
            background: rgba(0, 0, 0, 0.6);
            padding: 25px;
            border-radius: 25px;
            width: 85%;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .time-picker {
            margin-bottom: 10px;
        }

        .time-picker input {
            background: #111;
            border: 1px solid #444;
            color: #fff;
            font-size: 30px;
            width: 65px;
            text-align: center;
            border-radius: 12px;
            padding: 8px;
            font-family: 'Archivo Black', sans-serif;
        }

        .alarm-toggle {
            padding: 16px 38px;
            border-radius: 20px;
            border: none;
            font-family: 'Archivo Black';
            font-size: 14px;
            margin-top: 15px;
            text-transform: uppercase;
            transition: background 0.3s;
        }

        .alarm-off { 
            background: #3a3a3c; 
            color: #aeaeb2; 
        }

        .alarm-on { 
            background: #34c759; 
            color: #fff; 
            box-shadow: 0 0 20px rgba(52, 199, 89, 0.5); 
        }

        #stop-btn {
            display: none;
            position: fixed;
            bottom: 85px;
            left: 50%;
            -webkit-transform: translateX(-50%);
            transform: translateX(-50%);
            background: #ff3b30;
            color: white;
            padding: 20px 50px;
            border-radius: 40px;
            border: none;
            font-family: 'Archivo Black';
            font-size: 18px;
            z-index: 9999;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        /* =====================================================================
           5. BARRE DE NAVIGATION ET DOTS
           =====================================================================
        */
        #nav-bar {
            position: fixed;
            bottom: 20px;
            width: 100%;
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 500;
        }

        .nav-arrow {
            width: 55px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: rgba(255,255,255,0.4);
        }

        #dots-wrapper {
            background: rgba(0, 0, 0, 0.45);
            padding: 10px 18px;
            border-radius: 25px;
            display: flex;
            gap: 15px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .dot {
            width: 8px;
            height: 8px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            transition: all 0.4s ease;
        }

        .dot-active {
            background: #fff !important;
            width: 24px;
            border-radius: 10px;
        }
    </style>
</head>
<body onmousedown="handleStart(event)" onmouseup="handleEnd(event)" ontouchstart="handleStart(event)" ontouchend="handleEnd(event)">

    <div id="dynamic-bg"></div>
    
    <div id="bg-overlay"></div>

    <button id="stop-btn" onclick="stopAlarmNow()">ARRÊTER</button>

    <div id="wrapper">
        
        <div class="page active-page" id="p1">
            <div id="clock">00:00</div>
            <div id="date">CHARGEMENT...</div>
        </div>

        <div class="page" id="p2">
            <div class="widget-box">
                <span id="temp-main" style="font-size:38px">☀️ --°</span>
                <br>
                <span id="precip-info" style="color:#3498db; font-size:14px">PLUIE: --%</span>
            </div>
            
            <div class="widget-box">
                <div id="forecast-data" style="display:flex; justify-content:space-around; margin-top:10px;">
                    </div>
            </div>
        </div>

        <div class="page" id="p3">
            <div class="alarm-card">
                <div class="time-picker">
                    <input type="number" id="al-h" value="07" min="0" max="23"> : 
                    <input type="number" id="al-m" value="30" min="0" max="59">
                </div>
                <button id="al-btn" class="alarm-toggle alarm-off" onclick="toggleAlarm()">DÉSACTIVÉE</button>
            </div>
        </div>
        
    </div>

    <div id="nav-bar">
        <div class="nav-arrow" onclick="prevPage()">‹</div>
        <div id="dots-wrapper">
            <div class="dot dot-active" id="d1"></div>
            <div class="dot" id="d2"></div>
            <div class="dot" id="d3"></div>
        </div>
        <div class="nav-arrow" onclick="nextPage()">›</div>
    </div>

    <script type="text/javascript">
        /* =====================================================================
           LOGIQUE JAVASCRIPT - STANDBY 4S MASTER
           =====================================================================
        */
        
        // Variables globales de contrôle
        var currentPage = 1;
        var alarmH = -1;
        var alarmM = -1;
        var alarmActive = false;
        var isRinging = false;
        var audioCtx = null;
        var melodyInterval = null;
        
        // Variables pour la gestion du Swipe
        var xDown = null; 
        var yDown = null;

        /**
         * GESTION DU FOND D'ÉCRAN DYNAMIQUE
         * Bascule entre jour.jpg et nuit.jpg selon l'heure précise.
         */
        function updateBackground() {
            var now = new Date();
            var h = now.getHours();
            var m = now.getMinutes();
            
            // Calcul du temps total en minutes pour la précision
            var totalMinutes = (h * 60) + m;
            
            // PLAGE HORAIRE : 07h30 (450 min) à 21h00 (1260 min)
            var isDay = (totalMinutes >= 450 && totalMinutes < 1260);
            
            var bgElem = document.getElementById('dynamic-bg');
            var imageUrl = isDay ? "jour.jpg" : "nuit.jpg";
            
            // On vérifie si l'image doit changer
            var currentBg = bgElem.style.backgroundImage;
            if (currentBg.indexOf(imageUrl) === -1) {
                bgElem.style.backgroundImage = "url('" + imageUrl + "')";
                console.log("Système : Passage au mode " + (isDay ? "JOUR" : "NUIT"));
            }
        }

        /**
         * MISE À JOUR DE L'HEURE ET DE LA DATE
         * S'exécute toutes les secondes.
         */
        function updateClock() {
            var now = new Date();
            var h = now.getHours();
            var m = now.getMinutes();
            var s = now.getSeconds();

            // Vérification de l'alarme (déclenchement à la seconde 0)
            if (alarmActive && h == alarmH && m == alarmM && s == 0 && !isRinging) {
                startRinging();
            }

            // Affichage de l'horloge
            var hStr = (h < 10) ? "0" + h : h;
            var mStr = (m < 10) ? "0" + m : m;
            document.getElementById('clock').innerHTML = hStr + ":" + mStr;
            
            // Affichage de la date en français
            var jours = ["DIMANCHE", "LUNDI", "MARDI", "MERCREDI", "JEUDI", "VENDREDI", "SAMEDI"];
            var mois = ["JANVIER", "FÉVRIER", "MARS", "AVRIL", "MAI", "JUIN", "JUILLET", "AOÛT", "SEPTEMBRE", "OCTOBRE", "NOVEMBRE", "DÉCEMBRE"];
            
            var dateString = jours[now.getDay()] + " " + now.getDate() + " " + mois[now.getMonth()];
            document.getElementById('date').innerHTML = dateString;
            
            // Rafraîchir le fond à chaque minute
            if (s === 0) {
                updateBackground();
            }
        }

        /**
         * GESTION DU BALAYAGE TACTILE (SWIPE)
         */
        function handleStart(evt) {
            xDown = evt.touches ? evt.touches[0].clientX : evt.clientX;
            yDown = evt.touches ? evt.touches[0].clientY : evt.clientY;
        }

        function handleEnd(evt) {
            if (!xDown || !yDown) return;
            var xUp = evt.changedTouches ? evt.changedTouches[0].clientX : evt.clientX;
            var xDiff = xDown - xUp;
            
            // Seuil de détection de 40 pixels
            if (Math.abs(xDiff) > 40) {
                if (xDiff > 0) {
                    nextPage();
                } else {
                    prevPage();
                }
            }
            xDown = null; 
            yDown = null;
        }

        /**
         * NAVIGATION ENTRE LES PAGES
         */
        function showPage(n, dir) {
            if (n === currentPage) return;
            
            var oldP = document.getElementById('p' + currentPage);
            var newP = document.getElementById('p' + n);

            // Déclenchement des classes CSS d'animation
            oldP.className = "page " + (dir === 'next' ? 'exit-left' : 'exit-right');
            
            // Pré-positionnement de la nouvelle page sans transition
            newP.style.transition = 'none';
            newP.className = "page " + (dir === 'next' ? 'exit-right' : 'exit-left');
            
            // Timeout pour forcer le rendu avant l'entrée fluide
            setTimeout(function() {
                newP.style.transition = 'all 0.6s cubic-bezier(0.23, 1, 0.32, 1)';
                newP.className = "page active-page";
                
                // Mise à jour des indicateurs (dots)
                for(var i = 1; i <= 3; i++) {
                    document.getElementById('d' + i).className = "dot" + (i == n ? " dot-active" : "");
                }
            }, 50);
            
            currentPage = n;
        }

        function nextPage() { 
            var n = currentPage + 1; 
            if (n > 3) n = 1; 
            showPage(n, 'next'); 
        }

        function prevPage() { 
            var n = currentPage - 1; 
            if (n < 1) n = 3; 
            showPage(n, 'prev'); 
        }

        /**
         * LOGIQUE DE L'ALARME
         */
        function toggleAlarm() {
            var btn = document.getElementById('al-btn');
            
            // Initialisation de l'AudioContext au premier clic (requis par Safari)
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            if (!alarmActive) {
                alarmH = parseInt(document.getElementById('al-h').value);
                alarmM = parseInt(document.getElementById('al-m').value);
                alarmActive = true;
                btn.innerHTML = "ACTIVÉE";
                btn.className = "alarm-toggle alarm-on";
            } else {
                alarmActive = false;
                btn.innerHTML = "DÉSACTIVÉE";
                btn.className = "alarm-toggle alarm-off";
                if (isRinging) stopAlarmNow();
            }
        }

        function startRinging() {
            isRinging = true;
            document.getElementById('stop-btn').style.display = "block";
            
            // Signal sonore cyclique
            melodyInterval = setInterval(function() {
                var osc = audioCtx.createOscillator();
                var g = audioCtx.createGain();
                osc.connect(g);
                g.connect(audioCtx.destination);
                osc.frequency.value = 880; // Note La
                g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            }, 1000);
        }

        function stopAlarmNow() {
            isRinging = false;
            clearInterval(melodyInterval);
            document.getElementById('stop-btn').style.display = "none";
        }

        /**
         * RÉCUPÉRATION DES DONNÉES MÉTÉO (API OPEN-METEO)
         */
        function getMeteo() {
            var xhr = new XMLHttpRequest();
            // URL configurée pour ta position géographique
            var url = 'https://api.open-meteo.com/v1/forecast?latitude=43.5157&longitude=1.5159&daily=temperature_2m_max,precipitation_probability_max&current_weather=true&timezone=Europe%2FParis';
            
            xhr.open('GET', url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    
                    // Injection Température Actuelle
                    document.getElementById('temp-main').innerHTML = "☀️ " + Math.round(data.current_weather.temperature) + "°";
                    document.getElementById('precip-info').innerHTML = "PLUIE: " + data.daily.precipitation_probability_max[0] + "%";
                    
                    // Injection Prévisions
                    var dArr = ["DIM", "LUN", "MAR", "MER", "JEU", "VEN", "SAM"];
                    var html = "";
                    for(var i = 1; i <= 4; i++) {
                        var d = new Date();
                        d.setDate(d.getDate() + i);
                        var temp = Math.round(data.daily.temperature_2m_max[i]);
                        html += "<div style='font-size:11px; color:#ddd'>" + dArr[d.getDay()] + "<br><span style='color:#fff; font-size:14px'>" + temp + "°</span></div>";
                    }
                    document.getElementById('forecast-data').innerHTML = html;
                }
            };
            xhr.send();
        }

        /**
         * DÉMARRAGE DE L'APPLICATION
         */
        window.onload = function() {
            // Premier check du fond et de l'heure
            updateBackground();
            updateClock();
            
            // Premier appel météo
            getMeteo();
            
            // Cycles de rafraîchissement
            setInterval(updateClock, 1000); // Horloge (1s)
            setInterval(getMeteo, 600000);   // Météo (10 min)
        };
        
    </script>
</body>
</html>
