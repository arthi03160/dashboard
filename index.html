<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <title>StandBy 4S Melodie</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #050505;
            background: radial-gradient(circle at center, #1a2a3a 0%, #0d1217 70%, #050505 100%);
            color: #ffffff; font-family: 'Archivo Black', Arial, sans-serif; 
            overflow: hidden;
        }
        
        #nav-left, #nav-right { position: absolute; width: 20%; height: 80%; z-index: 999; top: 10%; }
        #nav-left { left: 0; } #nav-right { right: 0; }

        #wrapper { width: 100%; height: 100%; position: relative; }
        .page { 
            position: absolute; width: 100%; height: 100%; 
            display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; 
            top: -2000px; left: -2000px;
        }
        .active-page { display: flex !important; top: 0 !important; left: 0 !important; z-index: 10; }

        #clock { font-size: 80px; line-height: 1; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #date { font-size: 16px; color: #a0aab4; margin-top: 10px; text-transform: uppercase; }

        .widget-grid { width: 90%; margin: 0 auto; }
        .widget {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px; padding: 10px; margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .alarm-ui { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 20px; width: 80%; }
        input[type="number"] {
            background: #222; border: 1px solid #444; color: #fff;
            font-size: 30px; width: 60px; text-align: center; border-radius: 10px; padding: 5px;
            font-family: 'Archivo Black', sans-serif;
        }
        .btn-alarm {
            padding: 12px 25px; border-radius: 12px; border: none; font-size: 14px;
            font-family: 'Archivo Black', sans-serif; text-transform: uppercase; margin-top: 10px;
        }
        .alarm-off { background: #333; color: #777; }
        .alarm-on { background: #27ae60; color: #fff; box-shadow: 0 0 15px #27ae60; }
        .btn-stop { background: #e74c3c; color: #fff; display: none; font-size: 20px; padding: 20px; width: 100%; position: fixed; bottom: 0; z-index: 1000; }

        .dot { display: inline-block; width: 6px; height: 6px; background: rgba(255,255,255,0.2); border-radius: 50%; margin: 0 4px; }
        .dot-active { background: #3498db !important; }
        #dots { position: fixed; bottom: 8px; width: 100%; text-align: center; }
    </style>
</head>
<body>

    <div id="nav-left" onclick="prevPage()"></div>
    <div id="nav-right" onclick="nextPage()"></div>
    
    <button id="stop-btn" class="btn-stop" onclick="stopAlarmNow()">ARRÊTER L'ALARME</button>

    <div id="wrapper">
        <div class="page active-page" id="p1">
            <div id="clock">--:--</div>
            <div id="date">CHARGEMENT...</div>
        </div>

        <div class="page" id="p2">
            <div class="widget-grid">
                <div class="widget">
                    <span id="emoji-main" style="font-size:32px">☀️</span>
                    <span style="font-size:30px" id="temp">--°</span>
                </div>
                <div class="widget">
                    <span style="font-size:9px; color:#888">PLUIE</span><br>
                    <span style="font-size:18px; color:#3498db" id="precip">--%</span>
                </div>
                <div class="widget" id="forecast"></div>
            </div>
        </div>

        <div class="page" id="p3">
            <div class="alarm-ui">
                <span style="font-size:10px; color:#888">RÉVEIL</span>
                <div style="margin: 15px 0;">
                    <input type="number" id="al-h" value="07" min="0" max="23"> : 
                    <input type="number" id="al-m" value="00" min="0" max="59">
                </div>
                <button id="al-btn" class="btn-alarm alarm-off" onclick="toggleAlarm()">OFF</button>
            </div>
            <div id="al-status" style="font-size:10px; margin-top:10px; color:#555">DÉSACTIVÉE</div>
        </div>
    </div>

    <div id="dots">
        <div class="dot dot-active" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div>
    </div>

    <script type="text/javascript">
        var currentPage = 1, alarmH = -1, alarmM = -1, alarmActive = false, isRinging = false;
        var audioCtx = null, melodyInterval = null;

        function updateClock() {
            var now = new Date();
            var h = now.getHours(), m = now.getMinutes();
            if (alarmActive && h == alarmH && m == alarmM && !isRinging) { startRinging(); }
            if (h < 10) h = "0" + h; if (m < 10) m = "0" + m;
            document.getElementById('clock').innerHTML = h + ":" + m;
            var jours = ["DIM", "LUN", "MAR", "MER", "JEU", "VEN", "SAM"], mois = ["JAN", "FEV", "MAR", "AVR", "MAI", "JUIN", "JUIL", "AOUT", "SEPT", "OCT", "NOV", "DEC"];
            document.getElementById('date').innerHTML = jours[now.getDay()] + " " + now.getDate() + " " + mois[now.getMonth()];
        }

        function toggleAlarm() {
            var btn = document.getElementById('al-btn'), status = document.getElementById('al-status');
            if (!alarmActive) {
                alarmH = parseInt(document.getElementById('al-h').value);
                alarmM = parseInt(document.getElementById('al-m').value);
                alarmActive = true; btn.innerHTML = "ON"; btn.className = "btn-alarm alarm-on";
                status.innerHTML = "SONNERA À " + (alarmH < 10 ? "0"+alarmH : alarmH) + ":" + (alarmM < 10 ? "0"+alarmM : alarmM);
                // On initialise l'audio sur un clic utilisateur (obligatoire iOS)
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } else {
                alarmActive = false; btn.innerHTML = "OFF"; btn.className = "btn-alarm alarm-off"; status.innerHTML = "DÉSACTIVÉE";
            }
        }

        function playNote(freq, duration) {
            if(!audioCtx) return;
            var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = "sine"; osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.05);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function startRinging() {
            isRinging = true;
            document.getElementById('stop-btn').style.display = "block";
            var notes = [440, 554, 659, 880]; // La, Do#, Mi, La (Arpège)
            var i = 0;
            melodyInterval = setInterval(function() {
                playNote(notes[i % 4], 0.3);
                i++;
            }, 400);
        }

        function stopAlarmNow() {
            isRinging = false; alarmActive = false;
            clearInterval(melodyInterval);
            document.getElementById('stop-btn').style.display = "none";
            document.getElementById('al-btn').innerHTML = "OFF";
            document.getElementById('al-btn').className = "btn-alarm alarm-off";
            document.getElementById('al-status').innerHTML = "ALARME ARRÊTÉE";
        }

        function showPage(n) {
            for(var i=1; i<=3; i++) {
                document.getElementById('p'+i).className = "page" + (i==n ? " active-page" : "");
                document.getElementById('d'+i).className = "dot" + (i==n ? " dot-active" : "");
            }
            currentPage = n;
        }
        function nextPage() { var n = currentPage + 1; if(n > 3) n = 1; showPage(n); }
        function prevPage() { var n = currentPage - 1; if(n < 1) n = 3; showPage(n); }

        function getMeteo() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'https://api.open-meteo.com/v1/forecast?latitude=43.5157&longitude=1.5159&daily=temperature_2m_max,weathercode,precipitation_probability_max&current_weather=true&timezone=Europe%2FParis', true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    document.getElementById('temp').innerHTML = Math.round(data.current_weather.temperature) + "°";
                    document.getElementById('precip').innerHTML = data.daily.precipitation_probability_max[0] + "%";
                    var daysArr = ["DIM", "LUN", "MAR", "MER", "JEU", "VEN", "SAM"], html = "<div style='display:table; width:100%'>";
                    for(var i=1; i<=4; i++) {
                        var d = new Date(); d.setDate(d.getDate() + i);
                        html += "<div style='display:table-cell; font-size:9px; color:#aaa'>"+daysArr[d.getDay()]+"<b style='display:block; color:#fff'>"+Math.round(data.daily.temperature_2m_max[i])+"°</b></div>";
                    }
                    document.getElementById('forecast').innerHTML = html + "</div>";
                }
            }; xhr.send();
        }

        window.onload = function() {
            updateClock(); getMeteo(); setInterval(updateClock, 1000); setInterval(getMeteo, 600000);
            document.getElementById('nav-right').addEventListener('touchend', function(e){ e.preventDefault(); nextPage(); }, false);
            document.getElementById('nav-left').addEventListener('touchend', function(e){ e.preventDefault(); prevPage(); }, false);
        };
    </script>
</body>
</html>
