<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icone.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    
    <title>StandBy 4S - Frosted Glass Edition</title>
    
    <style>
        /* =====================================================================
           SECTION 1 : SYSTÈME DE BASE
           =====================================================================
        */
        * {
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #ffffff;
            font-family: 'Archivo Black', Arial, sans-serif;
            overflow: hidden;
            position: fixed;
        }

        /* =====================================================================
           SECTION 2 : BACKGROUND ENGINE
           =====================================================================
        */
        #dynamic-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            -webkit-transition: background-image 2.5s ease-in-out;
            z-index: -1;
        }

        #bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2); /* Encore plus léger pour voir le verre */
            z-index: 0;
        }

        /* =====================================================================
           SECTION 3 : L'HEURE "FROSTED LIQUID GLASS" (LA PÉPITE)
           =====================================================================
        */
        #clock-container {
            position: relative;
            padding: 10px;
        }

        #clock {
            font-size: 105px; /* Un peu plus gros pour l'effet visuel */
            line-height: 1;
            letter-spacing: -5px;
            position: relative;
            
            /* TECHNIQUE DU VERRE DÉPOLI :
               On utilise une couleur presque transparente pour laisser passer le fond.
            */
            color: rgba(255, 255, 255, 0.15);
            
            /* L'effet de contour brillant (Rim Light) qui crée le volume */
            -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.5);
            
            /* COMBINAISON D'OMBRES POUR LE RÉALISME :
               1. Une lueur blanche externe pour le contour.
               2. Une ombre noire pour détacher le verre du fond.
               3. Une lueur diffuse pour l'effet "halo" de ton image.
            */
            filter: drop-shadow(0px 0px 1px rgba(255,255,255,0.8))
                    drop-shadow(0px 8px 12px rgba(0,0,0,0.5))
                    drop-shadow(0px 0px 20px rgba(255,255,255,0.2));
            
            /* Animation de flottement très légère */
            -webkit-animation: glassFloat 6s infinite ease-in-out;
        }

        @-webkit-keyframes glassFloat {
            0%, 100% { -webkit-transform: translateY(0); opacity: 0.9; }
            50% { -webkit-transform: translateY(-5px); opacity: 1; }
        }

        /* Style de la date (Validé : Glassmorphism pur) */
        #date {
            font-size: 14px;
            color: #fff;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 20px;
            border-radius: 25px;
            display: inline-block;
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* =====================================================================
           SECTION 4 : WIDGETS MÉTÉO (CONSERVÉS)
           =====================================================================
        */
        .widget-box {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 25px;
            padding: 20px;
            width: 92%;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        #forecast-data div {
            text-align: center;
            font-size: 11px;
            color: rgba(255,255,255,0.7);
        }

        #forecast-data b {
            font-size: 15px;
            display: block;
            margin-top: 5px;
            color: #fff;
        }

        /* =====================================================================
           SECTION 5 : ALARME UI (PÉPITE CONSERVÉE)
           =====================================================================
        */
        .alarm-glass-panel {
            background: rgba(255, 255, 255, 0.07);
            border-radius: 35px;
            padding: 35px;
            width: 88%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            -webkit-backdrop-filter: blur(25px);
            text-align: center;
        }

        .alarm-time-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .alarm-time-display input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 45px;
            width: 90px;
            text-align: center;
            border-radius: 20px;
            padding: 8px;
            font-family: 'Archivo Black';
        }

        .alarm-toggle-ios {
            width: 100%;
            padding: 22px;
            border-radius: 28px;
            border: none;
            font-family: 'Archivo Black';
            font-size: 15px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .alarm-off { background: rgba(255, 255, 255, 0.1); color: rgba(255,255,255,0.4); }
        .alarm-on { background: #34c759; color: #fff; box-shadow: 0 0 30px rgba(52, 199, 89, 0.5); }

        /* =====================================================================
           SECTION 6 : NAVIGATION
           =====================================================================
        */
        #wrapper { width: 100%; height: 100%; position: relative; z-index: 10; }

        .page {
            position: absolute;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            opacity: 0; visibility: hidden;
            -webkit-transform: scale(1.1);
            -webkit-transition: all 0.7s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .active-page { opacity: 1; visibility: visible; -webkit-transform: scale(1); }
        .exit-left { -webkit-transform: translateX(-100%) scale(0.9); opacity: 0; }
        .exit-right { -webkit-transform: translateX(100%) scale(0.9); opacity: 0; }

        #nav-bar {
            position: fixed; bottom: 25px; width: 100%;
            display: flex; justify-content: center; z-index: 500;
        }

        #dots-wrapper {
            background: rgba(255, 255, 255, 0.12);
            padding: 10px 25px; border-radius: 30px;
            display: flex; gap: 15px; border: 1px solid rgba(255,255,255,0.1);
        }

        .dot { width: 10px; height: 10px; background: rgba(255,255,255,0.2); border-radius: 50%; transition: 0.4s; }
        .dot-active { background: #fff; width: 32px; border-radius: 10px; }
        
        #stop-btn {
            display: none; position: fixed; top: 20px; right: 20px;
            background: #ff3b30; color: white; padding: 15px 30px;
            border-radius: 20px; border: none; font-family: 'Archivo Black'; z-index: 9999;
        }
    </style>
</head>
<body onmousedown="handleStart(event)" onmouseup="handleEnd(event)" ontouchstart="handleStart(event)" ontouchend="handleEnd(event)">

    <div id="dynamic-bg"></div>
    <div id="bg-overlay"></div>
    
    <button id="stop-btn" onclick="stopAlarmNow()">STOP ALARME</button>

    <div id="wrapper">
        
        <div class="page active-page" id="p1">
            <div id="clock-container">
                <div id="clock">00:00</div>
            </div>
            <div id="date">CHARGEMENT...</div>
        </div>

        <div class="page" id="p2">
            <div class="widget-box">
                <span id="temp-main" style="font-size:42px">☀️ --°</span>
                <p style="font-size:12px; opacity:0.6; margin-top:5px" id="precip-info">MÉTÉO ACTUELLE</p>
            </div>
            <div id="forecast-data" class="widget-box" style="display:flex; justify-content:space-around;">
                </div>
        </div>

        <div class="page" id="p3">
            <div class="alarm-glass-panel">
                <div class="alarm-time-display">
                    <input type="number" id="al-h" value="07">
                    <span style="font-size:30px; opacity:0.3">:</span>
                    <input type="number" id="al-m" value="30">
                </div>
                <button id="al-btn" class="alarm-toggle-ios alarm-off" onclick="toggleAlarm()">ACTIVER L'ALARME</button>
            </div>
        </div>
        
    </div>

    <div id="nav-bar">
        <div id="dots-wrapper">
            <div class="dot dot-active" id="d1"></div>
            <div class="dot" id="d2"></div>
            <div class="dot" id="d3"></div>
        </div>
    </div>

    <script type="text/javascript">
        /* =====================================================================
           SCRIPTS MASTER CORE
           =====================================================================
        */
        var currentPage = 1, alarmH = -1, alarmM = -1, alarmActive = false, isRinging = false;
        var audioCtx = null, melodyInterval = null, xDown = null, yDown = null;

        /**
         * GESTION DU FOND
         */
        function updateBackground() {
            var now = new Date();
            var totalMin = (now.getHours() * 60) + now.getMinutes();
            var isDay = (totalMin >= 450 && totalMin < 1260); // 7h30 - 21h00
            var bgElem = document.getElementById('dynamic-bg');
            var imageUrl = isDay ? "jour.jpg" : "nuit.jpg";
            if (bgElem.style.backgroundImage.indexOf(imageUrl) === -1) {
                bgElem.style.backgroundImage = "url('" + imageUrl + "')";
            }
        }

        /**
         * GESTION DE L'HORLOGE
         */
        function updateClock() {
            var now = new Date();
            var h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
            var hStr = (h < 10) ? "0" + h : h;
            var mStr = (m < 10) ? "0" + m : m;
            
            document.getElementById('clock').innerHTML = hStr + ":" + mStr;

            if (alarmActive && h == alarmH && m == alarmM && s == 0 && !isRinging) startRinging();

            var jours = ["DIMANCHE", "LUNDI", "MARDI", "MERCREDI", "JEUDI", "VENDREDI", "SAMEDI"];
            var mois = ["JANVIER", "FÉVRIER", "MARS", "AVRIL", "MAI", "JUIN", "JUILLET", "AOÛT", "SEPTEMBRE", "OCTOBRE", "NOVEMBRE", "DÉCEMBRE"];
            document.getElementById('date').innerHTML = jours[now.getDay()] + " " + now.getDate() + " " + mois[now.getMonth()];
            
            if (s === 0) updateBackground();
        }

        /**
         * NAVIGATION SWIPE
         */
        function handleStart(evt) {
            xDown = evt.touches ? evt.touches[0].clientX : evt.clientX;
            yDown = evt.touches ? evt.touches[0].clientY : evt.clientY;
        }

        function handleEnd(evt) {
            if (!xDown || !yDown) return;
            var xUp = evt.changedTouches ? evt.changedTouches[0].clientX : evt.clientX;
            var xDiff = xDown - xUp;
            if (Math.abs(xDiff) > 50) {
                if (xDiff > 0) movePage(1); else movePage(-1);
            }
            xDown = null; yDown = null;
        }

        function movePage(dir) {
            var next = currentPage + dir;
            if (next < 1) next = 3; if (next > 3) next = 1;
            var oldP = document.getElementById('p' + currentPage);
            var newP = document.getElementById('p' + next);
            oldP.className = "page " + (dir > 0 ? "exit-left" : "exit-right");
            newP.style.transition = "none";
            newP.className = "page " + (dir > 0 ? "exit-right" : "exit-left");
            setTimeout(function() {
                newP.style.transition = "all 0.7s cubic-bezier(0.19, 1, 0.22, 1)";
                newP.className = "page active-page";
                for(var i=1; i<=3; i++) document.getElementById('d'+i).className = "dot" + (i==next ? " dot-active" : "");
                currentPage = next;
            }, 50);
        }

        /**
         * MÉTÉO (CORRECTED DAYS)
         */
        function getMeteo() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'https://api.open-meteo.com/v1/forecast?latitude=43.5157&longitude=1.5159&daily=temperature_2m_max&current_weather=true&timezone=Europe%2FParis', true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var d = JSON.parse(xhr.responseText);
                    document.getElementById('temp-main').innerHTML = "☀️ " + Math.round(d.current_weather.temperature) + "°";
                    
                    var dNames = ["DIM", "LUN", "MAR", "MER", "JEU", "VEN", "SAM"];
                    var html = "";
                    for(var i=1; i<=4; i++) {
                        var dateObj = new Date();
                        dateObj.setDate(dateObj.getDate() + i);
                        var dayName = dNames[dateObj.getDay()];
                        html += "<div>" + dayName + "<br><b>" + Math.round(d.daily.temperature_2m_max[i]) + "°</b></div>";
                    }
                    document.getElementById('forecast-data').innerHTML = html;
                }
            };
            xhr.send();
        }

        /**
         * ALARME CORE
         */
        function toggleAlarm() {
            var btn = document.getElementById('al-btn');
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (!alarmActive) {
                alarmH = parseInt(document.getElementById('al-h').value);
                alarmM = parseInt(document.getElementById('al-m').value);
                alarmActive = true; 
                btn.innerHTML = "ALARME ACTIVÉE"; 
                btn.className = "alarm-toggle-ios alarm-on";
            } else {
                alarmActive = false; 
                btn.innerHTML = "ACTIVER L'ALARME"; 
                btn.className = "alarm-toggle-ios alarm-off";
                stopAlarmNow();
            }
        }

        function startRinging() {
            isRinging = true; document.getElementById('stop-btn').style.display = "block";
            melodyInterval = setInterval(function() {
                var o = audioCtx.createOscillator(); var g = audioCtx.createGain();
                o.connect(g); g.connect(audioCtx.destination);
                o.frequency.value = 880; g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                o.start(); o.stop(audioCtx.currentTime + 0.8);
            }, 1000);
        }

        function stopAlarmNow() {
            isRinging = false; clearInterval(melodyInterval);
            document.getElementById('stop-btn').style.display = "none";
        }

        window.onload = function() {
            updateBackground(); updateClock(); getMeteo();
            setInterval(updateClock, 1000); setInterval(getMeteo, 600000);
        };
    </script>
</body>
</html>
