<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icone.png">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <title>StandBy 4S Final</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #050505;
            background: radial-gradient(circle at center, #1a2a3a 0%, #0d1217 70%, #050505 100%);
            color: #ffffff; font-family: 'Archivo Black', Arial, sans-serif; 
            overflow: hidden;
        }
        
        #wrapper { width: 100%; height: 100%; position: relative; }
        
        .page { 
            position: absolute; width: 100%; height: 100%; 
            display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; 
            top: -2000px; left: -2000px;
        }
        .active-page { display: flex !important; top: 0 !important; left: 0 !important; z-index: 10; }

        #clock { font-size: 80px; line-height: 1; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #date { font-size: 16px; color: #a0aab4; margin-top: 10px; text-transform: uppercase; }

        /* --- STYLE BATTERIE --- */
        #status-bar-custom {
            position: fixed; top: 12px; right: 15px;
            display: flex; align-items: center; z-index: 1000;
            font-family: sans-serif; font-weight: bold;
        }
        #bat-level-text { font-size: 12px; margin-right: 5px; color: #fff; }
        #bat-shell {
            width: 24px; height: 11px; border: 1.5px solid rgba(255,255,255,0.4);
            border-radius: 3px; position: relative; padding: 1px;
        }
        #bat-shell::after {
            content: ''; position: absolute; right: -3.5px; top: 3px;
            width: 2px; height: 3.5px; background: rgba(255,255,255,0.4);
            border-radius: 0 1px 1px 0;
        }
        #bat-fill {
            height: 100%; background: #30d158; border-radius: 1px;
            width: 0%; transition: width 0.5s ease;
        }
        .bat-low { background: #ff3b30 !important; }
        .bat-charging { color: #30d158 !important; }

        .widget-grid { width: 85%; margin: 0 auto; }
        .widget {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px; padding: 10px; margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .alarm-ui { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 20px; width: 75%; }
        input[type="number"] {
            background: #222; border: 1px solid #444; color: #fff;
            font-size: 24px; width: 50px; text-align: center; border-radius: 8px; padding: 5px;
            font-family: 'Archivo Black', sans-serif;
        }
        .btn-alarm {
            padding: 10px 20px; border-radius: 10px; border: none; font-size: 12px;
            font-family: 'Archivo Black', sans-serif; text-transform: uppercase; margin-top: 10px;
        }
        .alarm-off { background: #333; color: #777; }
        .alarm-on { background: #27ae60; color: #fff; }
        
        #stop-btn { 
            display: none; background: #e74c3c; color: #fff; font-size: 20px; 
            padding: 20px; width: 100%; position: fixed; bottom: 0; left:0; 
            z-index: 2000; border: none; font-family: 'Archivo Black', sans-serif;
        }

        /* --- NAVIGATION MODERNE AVEC DOTS ÉTIRÉS --- */
        #nav-bar {
            position: fixed; bottom: 15px; width: 100%; height: 44px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 500; background: transparent;
        }
        .nav-arrow {
            width: 60px; height: 100%; display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: rgba(255,255,255,0.15); font-weight: bold;
        }
        #dots {
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 10px; border-radius: 20px;
            display: flex; align-items: center;
            -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
        }
        .dot { 
            display: inline-block; width: 6px; height: 6px; 
            background: rgba(255,255,255,0.3); border-radius: 3px; margin: 0 4px; 
            transition: all 0.3s ease;
        }
        .dot-active { 
            background: #ffffff !important; 
            width: 18px; /* On l'étire en largeur (effet pilule) */
            box-shadow: 0 0 5px rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>

    <div id="status-bar-custom">
        <div id="bat-level-text">--%</div>
        <div id="bat-shell"><div id="bat-fill"></div></div>
    </div>

    <button id="stop-btn" onclick="stopAlarmNow()">ARRÊTER LE SON</button>

    <div id="wrapper">
        <div class="page active-page" id="p1">
            <div id="clock">--:--</div>
            <div id="date">CHARGEMENT...</div>
        </div>

        <div class="page" id="p2">
            <div class="widget-grid">
                <div class="widget">
                    <span id="emoji-main" style="font-size:32px">☀️</span>
                    <span style="font-size:30px" id="temp">--°</span>
                </div>
                <div class="widget">
                    <span style="font-size:18px; color:#3498db" id="precip">--%</span>
                </div>
                <div class="widget" id="forecast"></div>
            </div>
        </div>

        <div class="page" id="p3">
            <div class="alarm-ui">
                <div style="margin: 10px 0;">
                    <input type="number" id="al-h" value="07" min="0" max="23"> : 
                    <input type="number" id="al-m" value="00" min="0" max="59">
                </div>
                <button id="al-btn" class="btn-alarm alarm-off" onclick="toggleAlarm()">OFF</button>
            </div>
            <div id="al-status" style="font-size:10px; margin-top:10px; color:#555">DÉSACTIVÉE</div>
        </div>
    </div>

    <div id="nav-bar">
        <div class="nav-arrow" onclick="prevPage()">‹</div>
        <div id="dots">
            <div class="dot dot-active" id="d1"></div>
            <div class="dot" id="d2"></div>
            <div class="dot" id="d3"></div>
        </div>
        <div class="nav-arrow" onclick="nextPage()">›</div>
    </div>

    <script type="text/javascript">
        var currentPage = 1, alarmH = -1, alarmM = -1, alarmActive = false, isRinging = false;
        var audioCtx = null, melodyInterval = null;

        function updateClock() {
            var now = new Date();
            var h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
            if (alarmActive && h == alarmH && m == alarmM && s == 0 && !isRinging) { startRinging(); }
            if (h < 10) h = "0" + h; if (m < 10) m = "0" + m;
            document.getElementById('clock').innerHTML = h + ":" + m;
            var jours = ["DIM", "LUN", "MAR", "MER", "JEU", "VEN", "SAM"], mois = ["JAN", "FEV", "MAR", "AVR", "MAI", "JUIN", "JUIL", "AOUT", "SEPT", "OCT", "NOV", "DEC"];
            document.getElementById('date').innerHTML = jours[now.getDay()] + " " + now.getDate() + " " + mois[now.getMonth()];
            updateBattery();
        }

        function updateBattery() {
            var battery = navigator.battery || navigator.webkitBattery || navigator.mozBattery;
            if (battery) {
                var level = Math.round(battery.level * 100);
                document.getElementById('bat-level-text').innerHTML = (battery.charging ? "⚡ " : "") + level + "%";
                var fill = document.getElementById('bat-fill');
                fill.style.width = level + "%";
                if (level <= 20 && !battery.charging) { fill.className = "bat-low"; } else { fill.className = ""; }
                if (battery.charging) { document.getElementById('bat-level-text').className = "bat-charging"; } else { document.getElementById('bat-level-text').className = ""; }
            }
        }

        function toggleAlarm() {
            var btn = document.getElementById('al-btn'), status = document.getElementById('al-status');
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                var buffer = audioCtx.createBuffer(1, 1, 22050);
                var source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);
                source.start(0);
            }
            if (!alarmActive) {
                alarmH = parseInt(document.getElementById('al-h').value);
                alarmM = parseInt(document.getElementById('al-m').value);
                alarmActive = true; btn.innerHTML = "ON"; btn.className = "btn-alarm alarm-on";
                status.innerHTML = "PROGRAMMÉE : " + (alarmH < 10 ? "0"+alarmH : alarmH) + ":" + (alarmM < 10 ? "0"+alarmM : alarmM);
            } else {
                alarmActive = false; btn.innerHTML = "OFF"; btn.className = "btn-alarm alarm-off"; status.innerHTML = "DÉSACTIVÉE";
                if(isRinging) stopAlarmNow();
            }
        }

        function playNote(freq, duration) {
            if(!audioCtx) return;
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = "triangle"; osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function startRinging() {
            isRinging = true;
            document.getElementById('stop-btn').style.display = "block";
            melodyInterval = setInterval(function() {
                playNote(659.25, 0.4);
                setTimeout(function(){ if(isRinging) playNote(783.99, 0.4); }, 400);
            }, 1200);
        }

        function stopAlarmNow() {
            isRinging = false;
            clearInterval(melodyInterval);
            document.getElementById('stop-btn').style.display = "none";
            document.getElementById('al-status').innerHTML = "ACTIVE POUR DEMAIN";
        }

        function showPage(n) {
            for(var i=1; i<=3; i++) {
                document.getElementById('p'+i).className = "page" + (i==n ? " active-page" : "");
                document.getElementById('d'+i).className = "dot" + (i==n ? " dot-active" : "");
            }
            currentPage = n;
        }
        function nextPage() { var n = currentPage + 1; if(n > 3) n = 1; showPage(n); }
        function prevPage() { var n = currentPage - 1; if(n < 1) n = 3; showPage(n); }

        function getMeteo() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'https://api.open-meteo.com/v1/forecast?latitude=43.5157&longitude=1.5159&daily=temperature_2m_max,weathercode,precipitation_probability_max&current_weather=true&timezone=Europe%2FParis', true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    document.getElementById('temp').innerHTML = Math.round(data.current_weather.temperature) + "°";
                    document.getElementById('precip').innerHTML = "PLUIE: " + data.daily.precipitation_probability_max[0] + "%";
                    var daysArr = ["DIM", "LUN", "MAR", "MER", "JEU", "VEN", "SAM"], html = "<div style='display:table; width:100%'>";
                    for(var i=1; i<=4; i++) {
                        var d = new Date(); d.setDate(d.getDate() + i);
                        html += "<div style='display:table-cell; font-size:9px; color:#aaa'>"+daysArr[d.getDay()]+"<b style='display:block; color:#fff'>"+Math.round(data.daily.temperature_2m_max[i])+"°</b></div>";
                    }
                    document.getElementById('forecast').innerHTML = html + "</div>";
                }
            }; xhr.send();
        }

        window.onload = function() {
            updateClock(); getMeteo(); setInterval(updateClock, 1000); setInterval(getMeteo, 600000);
        };
    </script>
</body>
</html>
