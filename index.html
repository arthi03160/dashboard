<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <title>StandBy 4S Final Sound</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #050505;
            background: radial-gradient(circle at center, #1a2a3a 0%, #0d1217 70%, #050505 100%);
            color: #ffffff; font-family: 'Archivo Black', Arial, sans-serif; 
            overflow: hidden;
        }
        #wrapper { width: 100%; height: 100%; position: relative; }
        .page { 
            position: absolute; width: 100%; height: 100%; 
            display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; 
            top: -2000px; left: -2000px;
        }
        .active-page { display: flex !important; top: 0 !important; left: 0 !important; z-index: 10; }
        #clock { font-size: 80px; line-height: 1; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #date { font-size: 16px; color: #a0aab4; margin-top: 10px; text-transform: uppercase; }
        .widget-grid { width: 85%; margin: 0 auto; }
        .widget { background: rgba(255, 255, 255, 0.08); border-radius: 15px; padding: 10px; margin-bottom: 8px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .alarm-ui { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 20px; width: 75%; }
        input[type="number"] { background: #222; border: 1px solid #444; color: #fff; font-size: 24px; width: 50px; text-align: center; border-radius: 8px; padding: 5px; font-family: 'Archivo Black', sans-serif; }
        .btn-alarm { padding: 10px 20px; border-radius: 10px; border: none; font-size: 12px; font-family: 'Archivo Black', sans-serif; text-transform: uppercase; margin-top: 10px; }
        .alarm-off { background: #333; color: #777; }
        .alarm-on { background: #27ae60; color: #fff; }
        #stop-btn { display: none; background: #e74c3c; color: #fff; font-size: 20px; padding: 20px; width: 100%; position: fixed; bottom: 0; left:0; z-index: 2000; border: none; font-family: 'Archivo Black', sans-serif; }
        #nav-bar { position: fixed; bottom: 0; width: 100%; height: 44px; display: flex; justify-content: space-between; align-items: center; z-index: 500; background: linear-gradient(to top, rgba(0,0,0,0.5), transparent); }
        .nav-arrow { width: 60px; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: rgba(255,255,255,0.3); }
        .dot { display: inline-block; width: 6px; height: 6px; background: rgba(255,255,255,0.2); border-radius: 50%; margin: 0 4px; }
        .dot-active { background: #3498db !important; }
    </style>
</head>
<body>

    <audio id="alarm-sound" loop>
        <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
        <source src="https://cdn.pixabay.com/audio/2022/03/24/audio_347395e87a.mp3" type="audio/mpeg">
    </audio>

    <button id="stop-btn" onclick="stopAlarmNow()">ARRÊTER L'ALARME</button>

    <div id="wrapper">
        <div class="page active-page" id="p1">
            <div id="clock">--:--</div>
            <div id="date">CHARGEMENT...</div>
        </div>
        <div class="page" id="p2">
            <div class="widget-grid">
                <div class="widget">☀️ <span id="temp">--°</span></div>
                <div class="widget" id="precip">--%</div>
                <div class="widget" id="forecast"></div>
            </div>
        </div>
        <div class="page" id="p3">
            <div class="alarm-ui">
                <input type="number" id="al-h" value="07"> : <input type="number" id="al-m" value="00">
                <br>
                <button id="al-btn" class="btn-alarm alarm-off" onclick="toggleAlarm()">OFF</button>
            </div>
            <div id="al-status" style="font-size:10px; margin-top:10px; color:#555">DÉSACTIVÉE</div>
        </div>
    </div>

    <div id="nav-bar">
        <div class="nav-arrow" onclick="prevPage()">‹</div>
        <div id="dots">
            <div class="dot dot-active" id="d1"></div>
            <div class="dot" id="d2"></div>
            <div class="dot" id="d3"></div>
        </div>
        <div class="nav-arrow" onclick="nextPage()">›</div>
    </div>

    <script type="text/javascript">
        var currentPage = 1, alarmH = -1, alarmM = -1, alarmActive = false;
        var audio = document.getElementById('alarm-sound');

        function updateClock() {
            var now = new Date();
            var h = now.getHours(), m = now.getMinutes();
            if (alarmActive && h == alarmH && m == alarmM) { startRinging(); }
            if (h < 10) h = "0" + h; if (m < 10) m = "0" + m;
            document.getElementById('clock').innerHTML = h + ":" + m;
            var jours = ["DIM", "LUN", "MAR", "MER", "JEU", "VEN", "SAM"], mois = ["JAN", "FEV", "MAR", "AVR", "MAI", "JUIN", "JUIL", "AOUT", "SEPT", "OCT", "NOV", "DEC"];
            document.getElementById('date').innerHTML = jours[now.getDay()] + " " + now.getDate() + " " + mois[now.getMonth()];
        }

        function toggleAlarm() {
            var btn = document.getElementById('al-btn');
            if (!alarmActive) {
                alarmH = parseInt(document.getElementById('al-h').value);
                alarmM = parseInt(document.getElementById('al-m').value);
                alarmActive = true;
                btn.innerHTML = "ON"; btn.className = "btn-alarm alarm-on";
                document.getElementById('al-status').innerHTML = "SONNERA À " + alarmH + ":" + alarmM;
                
                // CRUCIAL : On pré-lance le son et on le met en pause tout de suite
                // C'est la seule façon pour iOS 9 de valider l'audio
                audio.play();
                audio.pause();
                audio.currentTime = 0;
            } else {
                alarmActive = false;
                btn.innerHTML = "OFF"; btn.className = "btn-alarm alarm-off";
                document.getElementById('al-status').innerHTML = "DÉSACTIVÉE";
                audio.pause();
            }
        }

        function startRinging() {
            document.getElementById('stop-btn').style.display = "block";
            audio.play();
        }

        function stopAlarmNow() {
            alarmActive = false;
            audio.pause();
            audio.currentTime = 0;
            document.getElementById('stop-btn').style.display = "none";
            document.getElementById('al-btn').innerHTML = "OFF";
            document.getElementById('al-btn').className = "btn-alarm alarm-off";
        }

        function showPage(n) {
            for(var i=1; i<=3; i++) {
                document.getElementById('p'+i).className = "page" + (i==n ? " active-page" : "");
                document.getElementById('d'+i).className = "dot" + (i==n ? " dot-active" : "");
            }
            currentPage = n;
        }
        function nextPage() { var n = currentPage + 1; if(n > 3) n = 1; showPage(n); }
        function prevPage() { var n = currentPage - 1; if(n < 1) n = 3; showPage(n); }

        function getMeteo() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'https://api.open-meteo.com/v1/forecast?latitude=43.5157&longitude=1.5159&daily=temperature_2m_max,weathercode,precipitation_probability_max&current_weather=true&timezone=Europe%2FParis', true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    document.getElementById('temp').innerHTML = Math.round(data.current_weather.temperature) + "°";
                    document.getElementById('precip').innerHTML = "PLUIE: " + data.daily.precipitation_probability_max[0] + "%";
                }
            }; xhr.send();
        }

        window.onload = function() {
            updateClock(); getMeteo(); setInterval(updateClock, 1000); setInterval(getMeteo, 600000);
        };
    </script>
</body>
</html>
