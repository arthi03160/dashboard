<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icone.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    
    <title>StandBy 4S - Precision Time Edition</title>
    
    <style>
        /* ============================================================
           SECTION 1 : RESET & FOND DYNAMIQUE
           ============================================================
        */
        * {
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        input { 
            -webkit-user-select: auto !important; 
            user-select: auto !important; 
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #ffffff;
            font-family: 'Archivo Black', Arial, sans-serif;
            overflow: hidden;
            position: fixed;
        }

        /* Le conteneur d'image de fond */
        #dynamic-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            /* Transition lente pour un changement d'ambiance naturel */
            -webkit-transition: background-image 2.0s ease-in-out;
            transition: background-image 2.0s ease-in-out;
            z-index: -1;
        }

        /* Overlay sombre pour la lisibilité du texte blanc */
        #bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 0;
        }

        /* ============================================================
           SECTION 2 : ANIMATIONS DE NAVIGATION
           ============================================================
        */
        #wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            -webkit-perspective: 1000px;
            perspective: 1000px;
            z-index: 10;
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            -webkit-transform: scale(1.1);
            transform: scale(1.1);
            -webkit-transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            pointer-events: none;
        }

        .active-page {
            opacity: 1 !important;
            visibility: visible !important;
            -webkit-transform: scale(1) !important;
            transform: scale(1) !important;
            pointer-events: auto;
        }

        .exit-left {
            -webkit-transform: scale(0.8) translateX(-120%) !important;
            opacity: 0 !important;
        }

        .exit-right {
            -webkit-transform: scale(0.8) translateX(120%) !important;
            opacity: 0 !important;
        }

        /* ============================================================
           SECTION 3 : UI & WIDGETS
           ============================================================
        */
        #clock {
            font-size: 82px;
            line-height: 1;
            text-shadow: 0 5px 20px rgba(0,0,0,0.9);
            letter-spacing: -2px;
        }

        #date {
            font-size: 16px;
            color: #ffffff;
            margin-top: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.7);
        }

        .widget-box {
            background: rgba(0, 0, 0, 0.55);
            border-radius: 20px;
            padding: 15px;
            width: 85%;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            -webkit-backdrop-filter: blur(10px);
        }

        .alarm-card {
            background: rgba(0, 0, 0, 0.65);
            padding: 25px;
            border-radius: 25px;
            width: 85%;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .time-picker input {
            background: #111;
            border: 1px solid #444;
            color: #fff;
            font-size: 30px;
            width: 60px;
            text-align: center;
            border-radius: 12px;
            padding: 5px;
            font-family: 'Archivo Black', sans-serif;
        }

        .alarm-toggle {
            padding: 15px 35px;
            border-radius: 18px;
            border: none;
            font-family: 'Archivo Black';
            font-size: 14px;
            margin-top: 15px;
            text-transform: uppercase;
        }

        .alarm-off { background: #3a3a3c; color: #aeaeb2; }
        .alarm-on { background: #34c759; color: #fff; box-shadow: 0 0 15px rgba(52, 199, 89, 0.5); }

        #stop-btn {
            display: none;
            position: fixed;
            bottom: 80px;
            left: 50%;
            -webkit-transform: translateX(-50%);
            transform: translateX(-50%);
            background: #ff3b30;
            color: white;
            padding: 18px 45px;
            border-radius: 35px;
            border: none;
            font-family: 'Archivo Black';
            font-size: 18px;
            z-index: 9999;
        }

        /* ============================================================
           SECTION 4 : NAVIGATION (DOTS)
           ============================================================
        */
        #nav-bar {
            position: fixed;
            bottom: 20px;
            width: 100%;
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 500;
        }

        .nav-arrow {
            width: 50px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: rgba(255,255,255,0.4);
        }

        #dots-wrapper {
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 15px;
            border-radius: 25px;
            display: flex;
            gap: 15px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .dot {
            width: 8px;
            height: 8px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            transition: all 0.4s ease;
        }

        .dot-active {
            background: #fff !important;
            width: 22px;
            border-radius: 10px;
        }
    </style>
</head>
<body onmousedown="handleStart(event)" onmouseup="handleEnd(event)" ontouchstart="handleStart(event)" ontouchend="handleEnd(event)">

    <div id="dynamic-bg"></div>
    <div id="bg-overlay"></div>

    <button id="stop-btn" onclick="stopAlarmNow()">ARRÊTER</button>

    <div id="wrapper">
        <div class="page active-page" id="p1">
            <div id="clock">00:00</div>
            <div id="date">...</div>
        </div>

        <div class="page" id="p2">
            <div class="widget-box">
                <span id="temp-main" style="font-size:38px">☀️ --°</span><br>
                <span id="precip-info" style="color:#3498db; font-size:14px">PLUIE: --%</span>
            </div>
            <div class="widget-box">
                <div id="forecast-data" style="display:flex; justify-content:space-around; margin-top:10px;">
                    </div>
            </div>
        </div>

        <div class="page" id="p3">
            <div class="alarm-card">
                <div class="time-picker">
                    <input type="number" id="al-h" value="07"> : 
                    <input type="number" id="al-m" value="00">
                </div>
                <button id="al-btn" class="alarm-toggle alarm-off" onclick="toggleAlarm()">DÉSACTIVÉE</button>
            </div>
        </div>
    </div>

    <div id="nav-bar">
        <div class="nav-arrow" onclick="prevPage()">‹</div>
        <div id="dots-wrapper">
            <div class="dot dot-active" id="d1"></div>
            <div class="dot" id="d2"></div>
            <div class="dot" id="d3"></div>
        </div>
        <div class="nav-arrow" onclick="nextPage()">›</div>
    </div>

    <script type="text/javascript">
        /* ============================================================
           LOGIQUE JAVASCRIPT MASTER
           ============================================================
        */
        
        var currentPage = 1;
        var alarmH = -1, alarmM = -1, alarmActive = false, isRinging = false;
        var audioCtx = null, melodyInterval = null;
        var xDown = null, yDown = null;

        /**
         * GESTION DU FOND DYNAMIQUE (JOUR : 07h30 à 21h00)
         */
        function updateBackground() {
            var now = new Date();
            var h = now.getHours();
            var m = now.getMinutes();
            
            // On calcule le nombre total de minutes écoulées aujourd'hui
            var totalMinutes = (h * 60) + m;
            
            // 07h30 = (7 * 60) + 30 = 450 minutes
            // 21h00 = (21 * 60) + 0  = 1260 minutes
            var isDay = (totalMinutes >= 450 && totalMinutes < 1260);
            
            var bgElem = document.getElementById('dynamic-bg');
            var imageUrl = isDay ? "jour.jpg" : "nuit.jpg";
            
            // On ne change le fond que si nécessaire
            var currentBg = bgElem.style.backgroundImage;
            if (currentBg.indexOf(imageUrl) === -1) {
                bgElem.style.backgroundImage = "url('" + imageUrl + "')";
                console.log("Passage en mode : " + (isDay ? "JOUR" : "NUIT"));
            }
        }

        /**
         * MISE À JOUR DE L'HORLOGE
         */
        function updateClock() {
            var now = new Date();
            var h = now.getHours();
            var m = now.getMinutes();
            var s = now.getSeconds();

            // Déclenchement de l'alarme
            if (alarmActive && h == alarmH && m == alarmM && s == 0 && !isRinging) {
                startRinging();
            }

            document.getElementById('clock').innerHTML = (h<10?"0"+h:h) + ":" + (m<10?"0"+m:m);
            
            var jours = ["DIMANCHE", "LUNDI", "MARDI", "MERCREDI", "JEUDI", "VENDREDI", "SAMEDI"];
            var mois = ["JANVIER", "FÉVRIER", "MARS", "AVRIL", "MAI", "JUIN", "JUILLET", "AOÛT", "SEPTEMBRE", "OCTOBRE", "NOVEMBRE", "DÉCEMBRE"];
            document.getElementById('date').innerHTML = jours[now.getDay()] + " " + now.getDate() + " " + mois[now.getMonth()];
            
            // Vérification du fond à chaque minute (à la seconde 0)
            if (s === 0) updateBackground();
        }

        /**
         * GESTION DU SWIPE
         */
        function handleStart(evt) {
            xDown = evt.touches ? evt.touches[0].clientX : evt.clientX;
            yDown = evt.touches ? evt.touches[0].clientY : evt.clientY;
        }

        function handleEnd(evt) {
            if (!xDown || !yDown) return;
            var xUp = evt.changedTouches ? evt.changedTouches[0].clientX : evt.clientX;
            var xDiff = xDown - xUp;
            if (Math.abs(xDiff) > 40) {
                if (xDiff > 0) nextPage();
                else prevPage();
            }
            xDown = null; yDown = null;
        }

        function showPage(n, dir) {
            if (n === currentPage) return;
            var oldP = document.getElementById('p' + currentPage);
            var newP = document.getElementById('p' + n);

            oldP.className = "page " + (dir === 'next' ? 'exit-left' : 'exit-right');
            newP.style.transition = 'none';
            newP.className = "page " + (dir === 'next' ? 'exit-right' : 'exit-left');
            
            setTimeout(function() {
                newP.style.transition = 'all 0.6s cubic-bezier(0.23, 1, 0.32, 1)';
                newP.className = "page active-page";
                for(var i=1; i<=3; i++) {
                    document.getElementById('d'+i).className = "dot" + (i==n ? " dot-active" : "");
                }
            }, 50);
            currentPage = n;
        }

        function nextPage() { var n = currentPage + 1; if(n > 3) n = 1; showPage(n, 'next'); }
        function prevPage() { var n = currentPage - 1; if(n < 1) n = 3; showPage(n, 'prev'); }

        /**
         * GESTION ALARME
         */
        function toggleAlarm() {
            var btn = document.getElementById('al-btn');
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            if (!alarmActive) {
                alarmH = parseInt(document.getElementById('al-h').value);
                alarmM = parseInt(document.getElementById('al-m').value);
                alarmActive = true;
                btn.innerHTML = "ACTIVÉE";
                btn.className = "alarm-toggle alarm-on";
            } else {
                alarmActive = false;
                btn.innerHTML = "DÉSACTIVÉE";
                btn.className = "alarm-toggle alarm-off";
                if(isRinging) stopAlarmNow();
            }
        }

        function startRinging() {
            isRinging = true;
            document.getElementById('stop-btn').style.display = "block";
            melodyInterval = setInterval(function() {
                var osc = audioCtx.createOscillator();
                var g = audioCtx.createGain();
                osc.connect(g);
                g.connect(audioCtx.destination);
                osc.frequency.value = 880;
                g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            }, 1000);
        }

        function stopAlarmNow() {
            isRinging = false;
            clearInterval(melodyInterval);
            document.getElementById('stop-btn').style.display = "none";
        }

        /**
         * MÉTÉO API
         */
        function getMeteo() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'https://api.open-meteo.com/v1/forecast?latitude=43.5157&longitude=1.5159&daily=temperature_2m_max,precipitation_probability_max&current_weather=true&timezone=Europe%2FParis', true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    document.getElementById('temp-main').innerHTML = "☀️ " + Math.round(data.current_weather.temperature) + "°";
                    document.getElementById('precip-info').innerHTML = "PLUIE: " + data.daily.precipitation_probability_max[0] + "%";
                    var dArr = ["DIM", "LUN", "MAR", "MER", "JEU", "VEN", "SAM"];
                    var html = "";
                    for(var i=1; i<=4; i++) {
                        var d = new Date(); d.setDate(d.getDate() + i);
                        html += "<div style='font-size:11px; color:#ddd'>" + dArr[d.getDay()] + "<br><span style='color:#fff; font-size:14px'>" + Math.round(data.daily.temperature_2m_max[i]) + "°</span></div>";
                    }
                    document.getElementById('forecast-data').innerHTML = html;
                }
            };
            xhr.send();
        }

        /**
         * INITIALISATION
         */
        window.onload = function() {
            updateBackground(); // Premier check immédiat du fond
            updateClock();
            getMeteo();
            
            setInterval(updateClock, 1000);
            setInterval(getMeteo, 600000);
        };
    </script>
</body>
</html>
