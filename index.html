<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icone.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    
    <title>StandBy 4S - True Liquid Glass</title>
    
    <style>
        /* =====================================================================
           SECTION 1 : RESET STRUCTUREL
           =====================================================================
        */
        * {
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #ffffff;
            font-family: 'Archivo Black', Arial, sans-serif;
            overflow: hidden;
            position: fixed;
        }

        /* =====================================================================
           SECTION 2 : BACKGROUND ENGINE
           =====================================================================
        */
        #dynamic-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            -webkit-transition: background-image 2.5s ease-in-out;
            transition: background-image 2.5s ease-in-out;
            z-index: -1;
        }

        #bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            z-index: 0;
        }

        /* =====================================================================
           SECTION 3 : TRUE LIQUID GLASS UI (iOS 26)
           =====================================================================
        */
        #clock-container {
            position: relative;
            padding: 20px;
        }

        #clock {
            font-size: 85px;
            line-height: 1;
            letter-spacing: -3px;
            
            /* EFFET LIQUIDE AVANCÉ : 
               On crée une superposition de blancs et de gris pour simuler la vitre.
            */
            background: -webkit-linear-gradient(
                top, 
                rgba(255,255,255,1) 0%, 
                rgba(255,255,255,1) 48%, 
                rgba(180,180,180,1) 50%, 
                rgba(255,255,255,1) 52%, 
                rgba(200,200,200,1) 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            /* L'ombre portée simule la réfraction du verre sur le fond */
            filter: drop-shadow(0px 8px 15px rgba(0,0,0,0.7));
            
            /* Ajout d'un contour "Glossy" très fin pour détacher l'heure */
            -webkit-text-stroke: 0.5px rgba(255, 255, 255, 0.4);
        }

        /* Reflet spéculaire qui passe sur l'heure (Animation liquide) */
        #clock::after {
            content: attr(data-time);
            position: absolute;
            left: 0;
            top: 0;
            z-index: 2;
            background: -webkit-linear-gradient(
                135deg, 
                transparent 40%, 
                rgba(255,255,255,0.8) 50%, 
                transparent 60%
            );
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-animation: shine 6s infinite linear;
        }

        @-webkit-keyframes shine {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        #date {
            font-size: 15px;
            color: rgba(255,255,255,0.9);
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            /* Petit effet glassmorphism sur la date aussi */
            background: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
        }

        /* =====================================================================
           SECTION 4 : NAVIGATION & PAGES
           =====================================================================
        */
        #wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 10;
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            -webkit-transform: scale(1.1);
            -webkit-transition: all 0.7s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .active-page {
            opacity: 1 !important;
            visibility: visible !important;
            -webkit-transform: scale(1) !important;
        }

        .exit-left { -webkit-transform: translateX(-100%) scale(0.9) !important; opacity: 0 !important; }
        .exit-right { -webkit-transform: translateX(100%) scale(0.9) !important; opacity: 0 !important; }

        /* =====================================================================
           SECTION 5 : WIDGETS & ALARME
           =====================================================================
        */
        .widget-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 20px;
            width: 90%;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .time-picker input {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            font-size: 35px;
            width: 75px;
            text-align: center;
            border-radius: 15px;
            padding: 10px;
            font-family: 'Archivo Black';
        }

        .alarm-toggle {
            padding: 20px 45px;
            border-radius: 30px;
            border: none;
            font-family: 'Archivo Black';
            font-size: 14px;
            margin-top: 20px;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .alarm-off { background: rgba(255,255,255,0.2); color: #fff; }
        .alarm-on { background: #34c759; color: #fff; box-shadow: 0 0 20px rgba(52, 199, 89, 0.5); }

        /* =====================================================================
           SECTION 6 : DOTS & NAV BAR
           =====================================================================
        */
        #nav-bar {
            position: fixed;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 500;
        }

        #dots-wrapper {
            background: rgba(255, 255, 255, 0.15);
            padding: 10px 25px;
            border-radius: 30px;
            display: flex;
            gap: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            -webkit-backdrop-filter: blur(5px);
        }

        .dot {
            width: 10px;
            height: 10px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            transition: all 0.4s ease;
        }

        .dot-active {
            background: #fff !important;
            width: 30px;
            border-radius: 10px;
        }
        
        #stop-btn {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff3b30;
            color: white;
            padding: 15px 30px;
            border-radius: 20px;
            border: none;
            font-family: 'Archivo Black';
            z-index: 9999;
        }
    </style>
</head>
<body onmousedown="handleStart(event)" onmouseup="handleEnd(event)" ontouchstart="handleStart(event)" ontouchend="handleEnd(event)">

    <div id="dynamic-bg"></div>
    <div id="bg-overlay"></div>
    
    <button id="stop-btn" onclick="stopAlarmNow()">STOP</button>

    <div id="wrapper">
        
        <div class="page active-page" id="p1">
            <div id="clock-container">
                <div id="clock" data-time="00:00">00:00</div>
            </div>
            <div id="date">INITIALISATION</div>
        </div>

        <div class="page" id="p2">
            <div class="widget-box">
                <span id="temp-main" style="font-size:40px">☀️ --°</span>
                <p id="precip-info" style="font-size:12px; opacity:0.7; margin-top:5px">PRECIPITATIONS : --%</p>
            </div>
            <div id="forecast-data" class="widget-box" style="display:flex; justify-content:space-around;">
                </div>
        </div>

        <div class="page" id="p3">
            <div class="widget-box" style="background:rgba(0,0,0,0.4)">
                <div class="time-picker">
                    <input type="number" id="al-h" value="07"> : <input type="number" id="al-m" value="30">
                </div>
                <button id="al-btn" class="alarm-toggle alarm-off" onclick="toggleAlarm()">OFF</button>
            </div>
        </div>
        
    </div>

    <div id="nav-bar">
        <div id="dots-wrapper">
            <div class="dot dot-active" id="d1"></div>
            <div class="dot" id="d2"></div>
            <div class="dot" id="d3"></div>
        </div>
    </div>

    <script type="text/javascript">
        /* =====================================================================
           SCRIPTS MASTER CORE
           =====================================================================
        */
        var currentPage = 1, alarmH = -1, alarmM = -1, alarmActive = false, isRinging = false;
        var audioCtx = null, melodyInterval = null, xDown = null, yDown = null;

        function updateBackground() {
            var now = new Date();
            var totalMin = (now.getHours() * 60) + now.getMinutes();
            var isDay = (totalMin >= 450 && totalMin < 1260); // 7h30 - 21h00
            var bgElem = document.getElementById('dynamic-bg');
            var imageUrl = isDay ? "jour.jpg" : "nuit.jpg";
            if (bgElem.style.backgroundImage.indexOf(imageUrl) === -1) {
                bgElem.style.backgroundImage = "url('" + imageUrl + "')";
            }
        }

        function updateClock() {
            var now = new Date();
            var h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
            var hStr = (h < 10) ? "0" + h : h;
            var mStr = (m < 10) ? "0" + m : m;
            var timeStr = hStr + ":" + mStr;
            
            // Mise à jour de l'heure et du data-attribute pour le reflet
            var clockEl = document.getElementById('clock');
            clockEl.innerHTML = timeStr;
            clockEl.setAttribute('data-time', timeStr);

            if (alarmActive && h == alarmH && m == alarmM && s == 0 && !isRinging) startRinging();

            var jours = ["DIMANCHE", "LUNDI", "MARDI", "MERCREDI", "JEUDI", "VENDREDI", "SAMEDI"];
            var mois = ["JANVIER", "FEVRIER", "MARS", "AVRIL", "MAI", "JUIN", "JUILLET", "AOUT", "SEPTEMBRE", "OCTOBRE", "NOVEMBRE", "DECEMBRE"];
            document.getElementById('date').innerHTML = jours[now.getDay()] + " " + now.getDate() + " " + mois[now.getMonth()];
            
            if (s === 0) updateBackground();
        }

        /* LOGIQUE DE NAVIGATION */
        function handleStart(evt) {
            xDown = evt.touches ? evt.touches[0].clientX : evt.clientX;
            yDown = evt.touches ? evt.touches[0].clientY : evt.clientY;
        }

        function handleEnd(evt) {
            if (!xDown || !yDown) return;
            var xUp = evt.changedTouches ? evt.changedTouches[0].clientX : evt.clientX;
            var xDiff = xDown - xUp;
            if (Math.abs(xDiff) > 50) {
                if (xDiff > 0) movePage(1); else movePage(-1);
            }
            xDown = null; yDown = null;
        }

        function movePage(dir) {
            var next = currentPage + dir;
            if (next < 1) next = 3; if (next > 3) next = 1;
            var oldP = document.getElementById('p' + currentPage);
            var newP = document.getElementById('p' + next);
            oldP.className = "page " + (dir > 0 ? "exit-left" : "exit-right");
            newP.style.transition = "none";
            newP.className = "page " + (dir > 0 ? "exit-right" : "exit-left");
            setTimeout(function() {
                newP.style.transition = "all 0.7s cubic-bezier(0.19, 1, 0.22, 1)";
                newP.className = "page active-page";
                for(var i=1; i<=3; i++) document.getElementById('d'+i).className = "dot" + (i==next ? " dot-active" : "");
                currentPage = next;
            }, 50);
        }

        /* METEO & ALARME */
        function getMeteo() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'https://api.open-meteo.com/v1/forecast?latitude=43.5157&longitude=1.5159&daily=temperature_2m_max,precipitation_probability_max&current_weather=true&timezone=Europe%2FParis', true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var d = JSON.parse(xhr.responseText);
                    document.getElementById('temp-main').innerHTML = "☀️ " + Math.round(d.current_weather.temperature) + "°";
                    document.getElementById('precip-info').innerHTML = "PRECIPITATIONS : " + d.daily.precipitation_probability_max[0] + "%";
                    var html = "";
                    for(var i=1; i<=4; i++) {
                        var date = new Date(); date.setDate(date.getDate()+i);
                        html += "<div>" + date.getDate() + "<br><b>" + Math.round(d.daily.temperature_2m_max[i]) + "°</b></div>";
                    }
                    document.getElementById('forecast-data').innerHTML = html;
                }
            };
            xhr.send();
        }

        function toggleAlarm() {
            var btn = document.getElementById('al-btn');
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (!alarmActive) {
                alarmH = parseInt(document.getElementById('al-h').value);
                alarmM = parseInt(document.getElementById('al-m').value);
                alarmActive = true; btn.innerHTML = "ACTIVÉE"; btn.className = "alarm-toggle alarm-on";
            } else {
                alarmActive = false; btn.innerHTML = "OFF"; btn.className = "alarm-toggle alarm-off";
                stopAlarmNow();
            }
        }

        function startRinging() {
            isRinging = true; document.getElementById('stop-btn').style.display = "block";
            melodyInterval = setInterval(function() {
                var o = audioCtx.createOscillator(); var g = audioCtx.createGain();
                o.connect(g); g.connect(audioCtx.destination);
                o.frequency.value = 880; g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                o.start(); o.stop(audioCtx.currentTime + 0.8);
            }, 1000);
        }

        function stopAlarmNow() {
            isRinging = false; clearInterval(melodyInterval);
            document.getElementById('stop-btn').style.display = "none";
        }

        window.onload = function() {
            updateBackground(); updateClock(); getMeteo();
            setInterval(updateClock, 1000); setInterval(getMeteo, 600000);
        };
    </script>
</body>
</html>
