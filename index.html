<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    
    <title>StandBy 4S - Final Smooth</title>
    
    <style>
        /* =====================================================================
           SECTION 1 : CORE
           =====================================================================
        */
        * {
            margin: 0; padding: 0;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }

        body, html {
            width: 100%; height: 100%;
            background-color: #000;
            color: #ffffff;
            font-family: 'Archivo Black', Arial, sans-serif;
            overflow: hidden;
            position: fixed;
        }

        input { 
            -webkit-user-select: auto !important; 
            user-select: auto !important; 
            pointer-events: auto !important;
            -webkit-appearance: none;
        }

        /* =====================================================================
           SECTION 2 : BACKGROUND ENGINE
           =====================================================================
        */
        #dynamic-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            -webkit-transition: background-image 2s ease; z-index: -1;
        }

        #bg-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.2); z-index: 0;
        }

        /* =====================================================================
           SECTION 3 : L'HEURE (POINTS RONDS SAFARI)
           =====================================================================
        */
        #clock-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .time-part {
            font-size: 108px;
            letter-spacing: -4px;
            color: rgba(255, 255, 255, 0.45);
            -webkit-text-stroke: 1.8px rgba(255, 255, 255, 0.85);
            filter: drop-shadow(0px 0px 10px rgba(255,255,255,0.3));
        }

        .separator-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding: 0 5px;
            margin-top: 5px;
        }

        .dot-round {
            width: 14px;
            height: 14px;
            background: rgba(255, 255, 255, 0.45);
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0px 0px 8px rgba(255,255,255,0.3);
        }

        #date {
            font-size: 14px;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: inline-block;
        }

        /* =====================================================================
           SECTION 4 : WIDGETS (SANS BUG)
           =====================================================================
        */
        .widget-box {
            position: relative;
            width: 92%;
            margin-bottom: 12px;
            padding: 22px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            text-align: center;
        }

        /* =====================================================================
           SECTION 5 : ANIMATION SCALE RESTAURÉE
           =====================================================================
        */
        .page {
            position: absolute;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            
            /* État par défaut : Caché et un peu petit */
            opacity: 0;
            visibility: hidden;
            -webkit-transform: scale(0.85);
            
            /* Transition fluide combinant Scale et Opacity */
            -webkit-transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .active-page {
            opacity: 1;
            visibility: visible;
            -webkit-transform: scale(1);
        }

        /* Styles de sortie lors du swipe */
        .exit-left {
            -webkit-transform: translateX(-50%) scale(0.8);
            opacity: 0;
        }

        .exit-right {
            -webkit-transform: translateX(50%) scale(0.8);
            opacity: 0;
        }

        /* =====================================================================
           SECTION 6 : ALARME & NAV
           =====================================================================
        */
        #p3 { justify-content: flex-start !important; padding-top: 40px; }

        .alarm-glass-panel {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 40px; padding: 30px; width: 90%;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
        }

        .alarm-time-display input {
            background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.4);
            color: #fff; font-size: 45px; width: 100px; text-align: center; border-radius: 20px; padding: 10px;
            font-family: 'Archivo Black';
        }

        #nav-bar {
            position: fixed; bottom: 10px;
            width: 100%; display: flex; justify-content: center; z-index: 500;
        }

        #dots-wrapper {
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 25px; border-radius: 30px;
            display: flex; gap: 15px; border: 1px solid rgba(255,255,255,0.2);
        }

        .dot { width: 8px; height: 8px; background: rgba(255,255,255,0.3); border-radius: 50%; transition: 0.4s; }
        .dot-active { background: #fff; width: 30px; border-radius: 10px; }
    </style>
</head>
<body onmousedown="handleStart(event)" onmouseup="handleEnd(event)" ontouchstart="handleStart(event)" ontouchend="handleEnd(event)">

    <div id="dynamic-bg"></div>
    <div id="bg-overlay"></div>
    
    <button id="stop-btn" style="display:none; position:fixed; top:20px; right:20px; z-index:10000; background:#ff3b30; color:#fff; border:none; padding:15px 25px; border-radius:20px; font-family:'Archivo Black';" onclick="stopAlarmNow()">STOP</button>

    <div id="wrapper">
        <div class="page active-page" id="p1">
            <div id="clock-container">
                <div id="h-display" class="time-part">00</div>
                <div class="separator-container">
                    <div class="dot-round"></div>
                    <div class="dot-round"></div>
                </div>
                <div id="m-display" class="time-part">00</div>
            </div>
            <div id="date">SYNC...</div>
        </div>

        <div class="page" id="p2">
            <div class="widget-box">
                <span id="temp-main" style="font-size:48px">--°</span>
                <p style="font-size:12px; opacity:0.6; margin-top:5px">EXTÉRIEUR</p>
            </div>
            <div id="forecast-data" class="widget-box" style="display:flex; justify-content:space-around;"></div>
        </div>

        <div class="page" id="p3">
            <div class="alarm-glass-panel">
                <div class="alarm-time-display" style="display:flex; justify-content:center; align-items:center; gap:15px; margin-bottom:30px;">
                    <input type="number" id="al-h" value="07">
                    <span style="font-size:30px; opacity:0.4">:</span>
                    <input type="number" id="al-m" value="30">
                </div>
                <button id="al-btn" style="width:100%; padding:22px; border-radius:30px; border:none; font-family:'Archivo Black'; font-size:15px; text-transform:uppercase; background:rgba(255,255,255,0.2); color:#fff;" onclick="toggleAlarm()">ACTIVER</button>
            </div>
        </div>
    </div>

    <div id="nav-bar">
        <div id="dots-wrapper">
            <div class="dot dot-active" id="d1"></div>
            <div class="dot" id="d2"></div>
            <div class="dot" id="d3"></div>
        </div>
    </div>

    <script type="text/javascript">
        var currentPage = 1, alarmH = -1, alarmM = -1, alarmActive = false, isRinging = false;
        var audioCtx = null, melodyInterval = null, xDown = null, yDown = null;

        function updateBackground() {
            var now = new Date();
            var isDay = (now.getHours() >= 7 && (now.getHours() < 21));
            var bg = document.getElementById('dynamic-bg');
            var url = isDay ? "jour.jpg" : "nuit.jpg";
            if (bg.style.backgroundImage.indexOf(url) === -1) bg.style.backgroundImage = "url('"+url+"')";
        }

        function updateClock() {
            var now = new Date();
            var h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
            document.getElementById('h-display').innerHTML = (h<10?'0'+h:h);
            document.getElementById('m-display').innerHTML = (m<10?'0'+m:m);
            if (alarmActive && h == alarmH && m == alarmM && s == 0 && !isRinging) startRinging();
            var jours = ["DIMANCHE", "LUNDI", "MARDI", "MERCREDI", "JEUDI", "VENDREDI", "SAMEDI"];
            var mois = ["JANVIER", "FÉVRIER", "MARS", "AVRIL", "MAI", "JUIN", "JUILLET", "AOÛT", "SEPTEMBRE", "OCTOBRE", "NOVEMBRE", "DÉCEMBRE"];
            document.getElementById('date').innerHTML = jours[now.getDay()] + " " + now.getDate() + " " + mois[now.getMonth()];
            if (s === 0) updateBackground();
        }

        function handleStart(evt) {
            if(evt.target.tagName === 'INPUT' || evt.target.tagName === 'BUTTON') return;
            xDown = evt.touches ? evt.touches[0].clientX : evt.clientX;
        }
        function handleEnd(evt) {
            if(!xDown) return;
            var xUp = evt.changedTouches ? evt.changedTouches[0].clientX : evt.clientX;
            var xDiff = xDown - xUp;
            if (Math.abs(xDiff) > 50) {
                if (xDiff > 0) movePage(1); else movePage(-1);
            }
            xDown = null;
        }

        function movePage(dir) {
            var next = currentPage + dir;
            if (next < 1) next = 3; if (next > 3) next = 1;
            var oldP = document.getElementById('p' + currentPage);
            var newP = document.getElementById('p' + next);

            // Applique l'effet de sortie
            oldP.className = "page " + (dir > 0 ? "exit-left" : "exit-right");

            // Prépare la nouvelle page (déjà en scale 0.85 par défaut)
            newP.style.transition = "none";
            newP.className = "page " + (dir > 0 ? "exit-right" : "exit-left");

            setTimeout(function() {
                newP.style.transition = "all 0.6s cubic-bezier(0.19, 1, 0.22, 1)";
                newP.className = "page active-page";
                for(var i=1; i<=3; i++) document.getElementById('d'+i).className = "dot" + (i==next ? " dot-active" : "");
                currentPage = next;
            }, 50);
        }

        function getMeteo() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'https://api.open-meteo.com/v1/forecast?latitude=43.5157&longitude=1.5159&daily=temperature_2m_max&current_weather=true&timezone=Europe%2FParis', true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var d = JSON.parse(xhr.responseText);
                    document.getElementById('temp-main').innerHTML = Math.round(d.current_weather.temperature) + "°";
                    var dNames = ["DIM", "LUN", "MAR", "MER", "JEU", "VEN", "SAM"];
                    var html = "";
                    for(var i=1; i<=4; i++) {
                        var dateObj = new Date(); dateObj.setDate(dateObj.getDate() + i);
                        html += "<div>" + dNames[dateObj.getDay()] + "<br><b>" + Math.round(d.daily.temperature_2m_max[i]) + "°</b></div>";
                    }
                    document.getElementById('forecast-data').innerHTML = html;
                }
            };
            xhr.send();
        }

        function toggleAlarm() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            var btn = document.getElementById('al-btn');
            if (!alarmActive) {
                alarmH = parseInt(document.getElementById('al-h').value);
                alarmM = parseInt(document.getElementById('al-m').value);
                alarmActive = true; btn.innerHTML = "ACTIF"; btn.style.background = "#34c759";
            } else {
                alarmActive = false; btn.innerHTML = "ACTIVER"; btn.style.background = "rgba(255,255,255,0.2)";
                stopAlarmNow();
            }
        }

        function startRinging() {
            isRinging = true; document.getElementById('stop-btn').style.display = "block";
            melodyInterval = setInterval(function() {
                var o = audioCtx.createOscillator(); var g = audioCtx.createGain();
                o.connect(g); g.connect(audioCtx.destination);
                o.frequency.value = 880; g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                o.start(); o.stop(audioCtx.currentTime + 0.8);
            }, 1000);
        }

        function stopAlarmNow() {
            isRinging = false; clearInterval(melodyInterval);
            document.getElementById('stop-btn').style.display = "none";
        }

        window.onload = function() {
            updateBackground(); updateClock(); getMeteo();
            setInterval(updateClock, 1000); setInterval(getMeteo, 600000);
        };
    </script>
</body>
</html>
