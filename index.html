<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icone.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    
    <title>StandBy 4S - Liquid Glass Master</title>
    
    <style>
        /* =====================================================================
           SECTION 1 : RESET & ARCHITECTURE DE BASE
           =====================================================================
        */
        * {
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        /* Nécessaire pour que les inputs de l'alarme restent utilisables */
        input { 
            -webkit-user-select: auto !important; 
            user-select: auto !important; 
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #ffffff;
            font-family: 'Archivo Black', Arial, sans-serif;
            overflow: hidden;
            position: fixed;
        }

        /* =====================================================================
           SECTION 2 : GESTION DU FOND (DYNAMIC AMBIANCE)
           =====================================================================
        */
        #dynamic-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* RAPPEL : Utiliser jour.jpg et nuit.jpg en 960x640 */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            /* Transition de fondu fluide entre les états */
            -webkit-transition: background-image 2.5s ease-in-out;
            transition: background-image 2.5s ease-in-out;
            z-index: -1;
        }

        /* OVERLAY : Réduit à 0.25 comme demandé pour la clarté */
        #bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            z-index: 0;
        }

        /* =====================================================================
           SECTION 3 : EFFET LIQUID GLASS (STYLISTIQUE)
           =====================================================================
        */
        #clock {
            font-size: 82px;
            line-height: 1;
            letter-spacing: -2px;
            position: relative;
            
            /* Dégradé simulant le reflet du verre liquide */
            background: -webkit-linear-gradient(
                top, 
                #ffffff 0%, 
                #ffffff 40%, 
                #bcbcbc 48%, 
                #ffffff 52%, 
                #e8e8e8 100%
            );
            
            /* Masquage pour appliquer le dégradé uniquement au texte */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Ombres portées pour la profondeur et la lisibilité */
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.6)) 
                    drop-shadow(0px 0px 12px rgba(255,255,255,0.15));
            
            /* Animation de respiration pour le côté liquide */
            -webkit-animation: liquidBreathing 10s infinite ease-in-out;
        }

        @-webkit-keyframes liquidBreathing {
            0%, 100% { -webkit-filter: brightness(1); }
            50% { -webkit-filter: brightness(1.15); }
        }

        #date {
            font-size: 16px;
            color: #ffffff;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            opacity: 0.85;
        }

        /* =====================================================================
           SECTION 4 : PAGES ET ANIMATIONS DE NAVIGATION
           =====================================================================
        */
        #wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            -webkit-perspective: 1200px;
            z-index: 10;
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            
            /* Effet de zoom progressif */
            -webkit-transform: scale(1.15);
            -webkit-transition: all 0.7s cubic-bezier(0.23, 1, 0.32, 1);
            pointer-events: none;
        }

        .active-page {
            opacity: 1 !important;
            visibility: visible !important;
            -webkit-transform: scale(1) !important;
            pointer-events: auto;
        }

        /* Sortie vers la gauche */
        .exit-left {
            -webkit-transform: scale(0.85) translateX(-130%) !important;
            opacity: 0 !important;
        }

        /* Sortie vers la droite */
        .exit-right {
            -webkit-transform: scale(0.85) translateX(130%) !important;
            opacity: 0 !important;
        }

        /* =====================================================================
           SECTION 5 : DESIGN DES WIDGETS (BLUR UI)
           =====================================================================
        */
        .widget-box {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 22px;
            padding: 18px;
            width: 88%;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            -webkit-backdrop-filter: blur(12px);
        }

        .alarm-card {
            background: rgba(0, 0, 0, 0.6);
            padding: 28px;
            border-radius: 28px;
            width: 85%;
            border: 1px solid rgba(255, 255, 255, 0.22);
        }

        .time-picker {
            margin-bottom: 12px;
        }

        .time-picker input {
            background: #151515;
            border: 1px solid #333;
            color: #fff;
            font-size: 32px;
            width: 68px;
            text-align: center;
            border-radius: 14px;
            padding: 10px;
            font-family: 'Archivo Black', sans-serif;
        }

        .alarm-toggle {
            padding: 18px 40px;
            border-radius: 22px;
            border: none;
            font-family: 'Archivo Black';
            font-size: 14px;
            margin-top: 18px;
            text-transform: uppercase;
        }

        .alarm-off { 
            background: #2c2c2e; 
            color: #8e8e93; 
        }

        .alarm-on { 
            background: #34c759; 
            color: #fff; 
            box-shadow: 0 0 25px rgba(52, 199, 89, 0.4); 
        }

        #stop-btn {
            display: none;
            position: fixed;
            bottom: 90px;
            left: 50%;
            -webkit-transform: translateX(-50%);
            background: #ff3b30;
            color: white;
            padding: 22px 55px;
            border-radius: 45px;
            border: none;
            font-family: 'Archivo Black';
            font-size: 18px;
            z-index: 10000;
            box-shadow: 0 10px 30px rgba(255, 59, 48, 0.4);
        }

        /* =====================================================================
           SECTION 6 : NAVIGATION BAR & DOTS INDICATORS
           =====================================================================
        */
        #nav-bar {
            position: fixed;
            bottom: 20px;
            width: 100%;
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 500;
        }

        .nav-arrow {
            width: 60px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: rgba(255,255,255,0.35);
        }

        #dots-wrapper {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 25px;
            display: flex;
            gap: 15px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .dot {
            width: 9px;
            height: 9px;
            background: rgba(255,255,255,0.25);
            border-radius: 50%;
            transition: all 0.4s ease;
        }

        .dot-active {
            background: #fff !important;
            width: 26px;
            border-radius: 10px;
        }
    </style>
</head>
<body onmousedown="handleStart(event)" onmouseup="handleEnd(event)" ontouchstart="handleStart(event)" ontouchend="handleEnd(event)">

    <div id="dynamic-bg"></div>
    <div id="bg-overlay"></div>

    <button id="stop-btn" onclick="stopAlarmNow()">ARRÊTER</button>

    <div id="wrapper">
        
        <div class="page active-page" id="p1">
            <div id="clock">00:00</div>
            <div id="date">INITIALISATION...</div>
        </div>

        <div class="page" id="p2">
            <div class="widget-box">
                <span id="temp-main" style="font-size:38px">☀️ --°</span>
                <br>
                <span id="precip-info" style="color:#3498db; font-size:14px">HUMIDITÉ: --%</span>
            </div>
            <div class="widget-box">
                <div id="forecast-data" style="display:flex; justify-content:space-around; margin-top:10px;">
                    </div>
            </div>
        </div>

        <div class="page" id="p3">
            <div class="alarm-card">
                <div class="time-picker">
                    <input type="number" id="al-h" value="07"> : 
                    <input type="number" id="al-m" value="30">
                </div>
                <button id="al-btn" class="alarm-toggle alarm-off" onclick="toggleAlarm()">DÉSACTIVÉE</button>
            </div>
        </div>
        
    </div>

    <div id="nav-bar">
        <div class="nav-arrow" onclick="prevPage()">‹</div>
        <div id="dots-wrapper">
            <div class="dot dot-active" id="d1"></div>
            <div class="dot" id="d2"></div>
            <div class="dot" id="d3"></div>
        </div>
        <div class="nav-arrow" onclick="nextPage()">›</div>
    </div>

    <script type="text/javascript">
        /* =====================================================================
           JAVASCRIPT : STANDBY 4S MASTER CORE
           =====================================================================
        */
        
        // Variables de contrôle d'état
        var currentPage = 1;
        var alarmH = -1;
        var alarmM = -1;
        var alarmActive = false;
        var isRinging = false;
        var audioCtx = null;
        var melodyInterval = null;
        
        // Variables Swipe
        var xDown = null; 
        var yDown = null;

        /**
         * FONCTION : MISE À JOUR DU FOND
         * Seuil Jour : 07h30 (450m) | Seuil Nuit : 21h00 (1260m)
         */
        function updateBackground() {
            var now = new Date();
            var totalMinutes = (now.getHours() * 60) + now.getMinutes();
            
            var isDay = (totalMinutes >= 450 && totalMinutes < 1260);
            
            var bgElem = document.getElementById('dynamic-bg');
            var imageUrl = isDay ? "jour.jpg" : "nuit.jpg";
            
            // Mise à jour si changement d'état
            if (bgElem.style.backgroundImage.indexOf(imageUrl) === -1) {
                bgElem.style.backgroundImage = "url('" + imageUrl + "')";
            }
        }

        /**
         * FONCTION : HORLOGE PRINCIPALE
         */
        function updateClock() {
            var now = new Date();
            var h = now.getHours();
            var m = now.getMinutes();
            var s = now.getSeconds();

            // Check Alarme
            if (alarmActive && h == alarmH && m == alarmM && s == 0 && !isRinging) {
                startRinging();
            }

            // Formatage Heure
            var hStr = (h < 10) ? "0" + h : h;
            var mStr = (m < 10) ? "0" + m : m;
            document.getElementById('clock').innerHTML = hStr + ":" + mStr;
            
            // Formatage Date
            var jours = ["DIMANCHE", "LUNDI", "MARDI", "MERCREDI", "JEUDI", "VENDREDI", "SAMEDI"];
            var mois = ["JANVIER", "FÉVRIER", "MARS", "AVRIL", "MAI", "JUIN", "JUILLET", "AOÛT", "SEPTEMBRE", "OCTOBRE", "NOVEMBRE", "DÉCEMBRE"];
            
            var dateDisplay = jours[now.getDay()] + " " + now.getDate() + " " + mois[now.getMonth()];
            document.getElementById('date').innerHTML = dateDisplay;
            
            // Sync fond à la minute pile
            if (s === 0) updateBackground();
        }

        /**
         * FONCTION : NAVIGATION (SWIPE ENGINE)
         */
        function handleStart(evt) {
            xDown = evt.touches ? evt.touches[0].clientX : evt.clientX;
            yDown = evt.touches ? evt.touches[0].clientY : evt.clientY;
        }

        function handleEnd(evt) {
            if (!xDown || !yDown) return;
            var xUp = evt.changedTouches ? evt.changedTouches[0].clientX : evt.clientX;
            var xDiff = xDown - xUp;
            
            if (Math.abs(xDiff) > 50) {
                if (xDiff > 0) nextPage();
                else prevPage();
            }
            xDown = null; yDown = null;
        }

        /**
         * FONCTION : AFFICHAGE DES PAGES
         */
        function showPage(n, dir) {
            if (n === currentPage) return;
            
            var oldP = document.getElementById('p' + currentPage);
            var newP = document.getElementById('p' + n);

            oldP.className = "page " + (dir === 'next' ? 'exit-left' : 'exit-right');
            
            newP.style.transition = 'none';
            newP.className = "page " + (dir === 'next' ? 'exit-right' : 'exit-left');
            
            setTimeout(function() {
                newP.style.transition = 'all 0.7s cubic-bezier(0.23, 1, 0.32, 1)';
                newP.className = "page active-page";
                
                // Refresh dots
                for(var i = 1; i <= 3; i++) {
                    document.getElementById('d' + i).className = "dot" + (i == n ? " dot-active" : "");
                }
            }, 50);
            
            currentPage = n;
        }

        function nextPage() { 
            var n = currentPage + 1; 
            if (n > 3) n = 1; 
            showPage(n, 'next'); 
        }

        function prevPage() { 
            var n = currentPage - 1; 
            if (n < 1) n = 3; 
            showPage(n, 'prev'); 
        }

        /**
         * FONCTION : MÉTÉO CORE
         */
        function getMeteo() {
            var xhr = new XMLHttpRequest();
            var url = 'https://api.open-meteo.com/v1/forecast?latitude=43.5157&longitude=1.5159&daily=temperature_2m_max,precipitation_probability_max&current_weather=true&timezone=Europe%2FParis';
            
            xhr.open('GET', url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    
                    document.getElementById('temp-main').innerHTML = "☀️ " + Math.round(data.current_weather.temperature) + "°";
                    document.getElementById('precip-info').innerHTML = "PLUIE: " + data.daily.precipitation_probability_max[0] + "%";
                    
                    var dArr = ["DIM", "LUN", "MAR", "MER", "JEU", "VEN", "SAM"];
                    var html = "";
                    for(var i = 1; i <= 4; i++) {
                        var d = new Date(); d.setDate(d.getDate() + i);
                        html += "<div style='font-size:11px; color:#ccc'>" + dArr[d.getDay()] + "<br><span style='color:#fff; font-size:14px'>" + Math.round(data.daily.temperature_2m_max[i]) + "°</span></div>";
                    }
                    document.getElementById('forecast-data').innerHTML = html;
                }
            };
            xhr.send();
        }

        /**
         * FONCTION : ALARME CORE
         */
        function toggleAlarm() {
            var btn = document.getElementById('al-btn');
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            if (!alarmActive) {
                alarmH = parseInt(document.getElementById('al-h').value);
                alarmM = parseInt(document.getElementById('al-m').value);
                alarmActive = true;
                btn.innerHTML = "ACTIVÉE";
                btn.className = "alarm-toggle alarm-on";
            } else {
                alarmActive = false;
                btn.innerHTML = "DÉSACTIVÉE";
                btn.className = "alarm-toggle alarm-off";
                if (isRinging) stopAlarmNow();
            }
        }

        function startRinging() {
            isRinging = true;
            document.getElementById('stop-btn').style.display = "block";
            melodyInterval = setInterval(function() {
                var osc = audioCtx.createOscillator();
                var g = audioCtx.createGain();
                osc.connect(g); g.connect(audioCtx.destination);
                osc.frequency.value = 880;
                g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                osc.start(); osc.stop(audioCtx.currentTime + 0.8);
            }, 1000);
        }

        function stopAlarmNow() {
            isRinging = false;
            clearInterval(melodyInterval);
            document.getElementById('stop-btn').style.display = "none";
        }

        /**
         * INITIALISATION
         */
        window.onload = function() {
            updateBackground();
            updateClock();
            getMeteo();
            
            setInterval(updateClock, 1000);
            setInterval(getMeteo, 600000);
        };
    </script>
</body>
</html>
