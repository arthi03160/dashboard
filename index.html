<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <title>StandBy 4S</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #050505;
            background: radial-gradient(circle at center, #1a2a3a 0%, #0d1217 70%, #050505 100%);
            color: #ffffff; font-family: 'Archivo Black', Arial, sans-serif; 
            overflow: hidden;
        }
        /* Zone cliquable qui couvre tout l'écran */
        #touch-zone {
            position: absolute; width: 100%; height: 100%; z-index: 100;
        }
        #wrapper { width: 100%; height: 100%; position: relative; z-index: 1; }
        .page { 
            position: absolute; width: 100%; height: 100%; 
            display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; 
        }
        .active-page { display: flex !important; }

        #clock { font-size: 80px; line-height: 1; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #date { font-size: 16px; color: #a0aab4; margin-top: 10px; text-transform: uppercase; }

        .widget-grid { width: 90%; margin: 0 auto; }
        .widget {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px; padding: 10px; margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .emoji-icon { font-size: 32px; display: inline-block; }
        .temp-now { font-size: 30px; display: inline-block; vertical-align: middle; }
        .widget-label { font-size: 9px; color: #888; text-transform: uppercase; }
        .precip-val { font-size: 18px; color: #3498db; }

        .forecast-list { display: table; width: 100%; margin-top: 5px; }
        .f-day { display: table-cell; font-size: 9px; color: #aaa; text-align: center; width: 25%; }
        .f-day b { display: block; font-size: 12px; color: #fff; }

        #dots { position: fixed; bottom: 8px; width: 100%; text-align: center; z-index: 101; }
        .dot { display: inline-block; width: 7px; height: 7px; background: rgba(255,255,255,0.2); border-radius: 50%; margin: 0 4px; }
        .dot-active { background: #3498db !important; }
    </style>
</head>
<body>

    <div id="touch-zone"></div>

    <div id="wrapper">
        <div class="page active-page" id="p1">
            <div id="clock">--:--</div>
            <div id="date">CHARGEMENT...</div>
        </div>

        <div class="page" id="p2">
            <div class="widget-grid">
                <div class="widget">
                    <span class="widget-label">Météo</span><br>
                    <span id="emoji-main" class="emoji-icon">☀️</span>
                    <span class="temp-now" id="temp">--°</span>
                </div>
                <div class="widget">
                    <span class="widget-label">Précipitations</span><br>
                    <span class="precip-val" id="precip">--%</span>
                </div>
                <div class="widget">
                    <div class="forecast-list" id="forecast"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="dots">
        <div class="dot dot-active" id="d1"></div>
        <div class="dot" id="d2"></div>
    </div>

    <script type="text/javascript">
        var currentPage = 1;

        function updateClock() {
            var now = new Date();
            var h = now.getHours();
            var m = now.getMinutes();
            if (h < 10) h = "0" + h;
            if (m < 10) m = "0" + m;
            document.getElementById('clock').innerHTML = h + ":" + m;
            
            var jours = ["DIM", "LUN", "MAR", "MER", "JEU", "VEN", "SAM"];
            var mois = ["JAN", "FEV", "MAR", "AVR", "MAI", "JUIN", "JUIL", "AOUT", "SEPT", "OCT", "NOV", "DEC"];
            document.getElementById('date').innerHTML = jours[now.getDay()] + " " + now.getDate() + " " + mois[now.getMonth()];
        }

        function togglePage() {
            var p1 = document.getElementById('p1');
            var p2 = document.getElementById('p2');
            var d1 = document.getElementById('d1');
            var d2 = document.getElementById('d2');

            if (currentPage === 1) {
                p1.style.display = "none";
                p2.style.display = "flex";
                d1.className = "dot";
                d2.className = "dot dot-active";
                currentPage = 2;
            } else {
                p1.style.display = "flex";
                p2.style.display = "none";
                d1.className = "dot dot-active";
                d2.className = "dot";
                currentPage = 1;
            }
        }

        function getMeteo() {
            var xhr = new XMLHttpRequest();
            var url = 'https://api.open-meteo.com/v1/forecast?latitude=43.5157&longitude=1.5159&daily=temperature_2m_max,weathercode,precipitation_probability_max&current_weather=true&timezone=Europe%2FParis';
            xhr.open('GET', url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    document.getElementById('temp').innerHTML = Math.round(data.current_weather.temperature) + "°";
                    document.getElementById('precip').innerHTML = data.daily.precipitation_probability_max[0] + "%";
                    
                    var code = data.current_weather.weathercode;
                    var emoji = "☀️";
                    if(code > 0 && code <= 3) emoji = "🌤️";
                    if(code > 3 && code < 60) emoji = "☁️";
                    if(code >= 60) emoji = "🌧️";
                    document.getElementById('emoji-main').innerHTML = emoji;

                    var daysArr = ["DIM", "LUN", "MAR", "MER", "JEU", "VEN", "SAM"];
                    var html = "";
                    for(var i=1; i<=4; i++) {
                        var d = new Date();
                        d.setDate(d.getDate() + i);
                        html += "<div class='f-day'>" + daysArr[d.getDay()] + "<b>" + Math.round(data.daily.temperature_2m_max[i]) + "°</b></div>";
                    }
                    document.getElementById('forecast').innerHTML = html;
                }
            };
            xhr.send();
        }

        window.onload = function() {
            updateClock();
            getMeteo();
            setInterval(updateClock, 1000);
            setInterval(getMeteo, 600000);

            // Correction pour le tactile sur iPhone 4S
            var tz = document.getElementById('touch-zone');
            tz.addEventListener('touchstart', function(e) {
                togglePage();
            }, false);
            // On garde le click pour les navigateurs PC
            tz.addEventListener('click', function(e) {
                togglePage();
            }, false);
        };
    </script>
</body>
</html>
