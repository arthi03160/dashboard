<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    
    <title>StandBy 4S - Absolute Fix</title>
    
    <style>
        /* =====================================================================
           SECTION 1 : RESET & CORE
           =====================================================================
        */
        * {
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
            /* Désactivation des reflets tactiles par défaut */
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #ffffff;
            font-family: 'Archivo Black', Arial, sans-serif;
            overflow: hidden;
            position: fixed;
        }

        /* Réactivation propre pour l'alarme */
        input { 
            -webkit-user-select: auto !important; 
            user-select: auto !important; 
            pointer-events: auto !important;
            -webkit-appearance: none;
        }

        /* =====================================================================
           SECTION 2 : FOND DYNAMIQUE
           =====================================================================
        */
        #dynamic-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            -webkit-transition: background-image 2s ease-in-out;
            z-index: -1;
        }

        #bg-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.15);
            z-index: 0;
        }

        /* =====================================================================
           SECTION 3 : L'HEURE RADIANT GLASS (VALIDÉE)
           =====================================================================
        */
        #clock {
            font-size: 108px;
            line-height: 1;
            letter-spacing: -6px;
            position: relative;
            color: rgba(255, 255, 255, 0.45);
            -webkit-text-stroke: 1.8px rgba(255, 255, 255, 0.85);
            filter: drop-shadow(0px 0px 1px #fff)
                    drop-shadow(0px 0px 12px rgba(255,255,255,0.4))
                    drop-shadow(0px 8px 12px rgba(0,0,0,0.5));
            -webkit-animation: radiant 5s infinite ease-in-out;
        }

        @-webkit-keyframes radiant {
            0%, 100% { -webkit-filter: brightness(1); }
            50% { -webkit-filter: brightness(1.3); }
        }

        #date {
            font-size: 14px;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: rgba(255, 255, 255, 0.18);
            padding: 7px 20px;
            border-radius: 25px;
            display: inline-block;
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* =====================================================================
           SECTION 4 : WIDGETS - LE FIX RADICAL DES COINS
           =====================================================================
        */
        .widget-box {
            position: relative;
            width: 92%;
            margin-bottom: 12px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 25px;
            
            /* 1. ON SUPPRIME TOUTE OMBRE EXTERNE ET INTERNE */
            box-shadow: none !important;
            
            /* 2. ON FORCE LE DÉCOUPAGE PHYSIQUE DU WIDGET (WebKit Fix) */
            -webkit-mask-image: -webkit-radial-gradient(white, black); 
            overflow: hidden;

            /* 3. BORDURE UNIQUE POUR LE RELIEF */
            border: 1px solid rgba(255, 255, 255, 0.3);
            -webkit-backdrop-filter: blur(18px);
        }

        /* Ajout d'une lueur subtile via une bordure invisible */
        .widget-box::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
        }

        /* =====================================================================
           SECTION 5 : ALARME (POSITION & TACTILE)
           =====================================================================
        */
        #p3 {
            justify-content: flex-start !important;
            padding-top: 45px;
        }

        .alarm-glass-panel {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 35px;
            padding: 30px;
            width: 88%;
            border: 1px solid rgba(255, 255, 255, 0.25);
            -webkit-backdrop-filter: blur(20px);
            -webkit-mask-image: -webkit-radial-gradient(white, black);
            text-align: center;
            pointer-events: auto;
            z-index: 999;
        }

        .alarm-time-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .alarm-time-display input {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-size: 45px;
            width: 95px;
            text-align: center;
            border-radius: 18px;
            padding: 10px;
            font-family: 'Archivo Black';
            pointer-events: auto !important;
        }

        .alarm-toggle-ios {
            width: 100%;
            padding: 20px;
            border-radius: 25px;
            border: none;
            font-family: 'Archivo Black';
            font-size: 14px;
            text-transform: uppercase;
            pointer-events: auto;
        }

        .alarm-off { background: rgba(255, 255, 255, 0.15); color: #fff; }
        .alarm-on { background: #34c759; color: #fff; }

        /* =====================================================================
           SECTION 6 : NAVIGATION & DOTS (PLUS BAS)
           =====================================================================
        */
        #nav-bar {
            position: fixed; 
            bottom: 10px; /* Position minimale pour l'iPhone 4S */
            width: 100%;
            display: flex; justify-content: center; z-index: 500;
        }

        #dots-wrapper {
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 22px; border-radius: 30px;
            display: flex; gap: 12px; border: 1px solid rgba(255,255,255,0.2);
            -webkit-backdrop-filter: blur(8px);
        }

        .dot { width: 8px; height: 8px; background: rgba(255,255,255,0.3); border-radius: 50%; transition: 0.4s; }
        .dot-active { background: #fff; width: 28px; border-radius: 10px; }

        .page {
            position: absolute;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            opacity: 0; visibility: hidden;
            -webkit-transform: scale(1.1);
            -webkit-transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .active-page { opacity: 1; visibility: visible; -webkit-transform: scale(1); }
        .exit-left { -webkit-transform: translateX(-100%) scale(0.9); opacity: 0; }
        .exit-right { -webkit-transform: translateX(100%) scale(0.9); opacity: 0; }
    </style>
</head>
<body onmousedown="handleStart(event)" onmouseup="handleEnd(event)" ontouchstart="handleStart(event)" ontouchend="handleEnd(event)">

    <div id="dynamic-bg"></div>
    <div id="bg-overlay"></div>
    
    <button id="stop-btn" style="display:none; position:fixed; top:20px; right:20px; z-index:10000; background:#ff3b30; color:#fff; border:none; padding:15px 25px; border-radius:20px; font-family:'Archivo Black';" onclick="stopAlarmNow()">STOP</button>

    <div id="wrapper">
        <div class="page active-page" id="p1">
            <div id="clock">00:00</div>
            <div id="date">-- -- ----</div>
        </div>

        <div class="page" id="p2">
            <div class="widget-box">
                <span id="temp-main" style="font-size:42px">☀️ --°</span>
                <p style="font-size:11px; opacity:0.8; margin-top:5px">MÉTÉO ACTUELLE</p>
            </div>
            <div id="forecast-data" class="widget-box" style="display:flex; justify-content:space-around;"></div>
        </div>

        <div class="page" id="p3">
            <div class="alarm-glass-panel">
                <div class="alarm-time-display">
                    <input type="number" id="al-h" value="07" pattern="\d*">
                    <span style="font-size:30px; opacity:0.4">:</span>
                    <input type="number" id="al-m" value="30" pattern="\d*">
                </div>
                <button id="al-btn" class="alarm-toggle-ios alarm-off" onclick="toggleAlarm()">ACTIVER</button>
            </div>
        </div>
    </div>

    <div id="nav-bar">
        <div id="dots-wrapper">
            <div class="dot dot-active" id="d1"></div>
            <div class="dot" id="d2"></div>
            <div class="dot" id="d3"></div>
        </div>
    </div>

    <script type="text/javascript">
        var currentPage = 1, alarmH = -1, alarmM = -1, alarmActive = false, isRinging = false;
        var audioCtx = null, melodyInterval = null, xDown = null, yDown = null;

        function updateBackground() {
            var now = new Date();
            var isDay = (now.getHours() >= 7 && (now.getHours() < 21));
            var bg = document.getElementById('dynamic-bg');
            var url = isDay ? "jour.jpg" : "nuit.jpg";
            if (bg.style.backgroundImage.indexOf(url) === -1) bg.style.backgroundImage = "url('"+url+"')";
        }

        function updateClock() {
            var now = new Date();
            var h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
            document.getElementById('clock').innerHTML = (h<10?'0'+h:h) + ":" + (m<10?'0'+m:m);
            if (alarmActive && h == alarmH && m == alarmM && s == 0 && !isRinging) startRinging();
            var jours = ["DIMANCHE", "LUNDI", "MARDI", "MERCREDI", "JEUDI", "VENDREDI", "SAMEDI"];
            var mois = ["JANVIER", "FÉVRIER", "MARS", "AVRIL", "MAI", "JUIN", "JUILLET", "AOÛT", "SEPTEMBRE", "OCTOBRE", "NOVEMBRE", "DÉCEMBRE"];
            document.getElementById('date').innerHTML = jours[now.getDay()] + " " + now.getDate() + " " + mois[now.getMonth()];
            if (s === 0) updateBackground();
        }

        function handleStart(evt) {
            if(evt.target.tagName === 'INPUT' || evt.target.tagName === 'BUTTON') return;
            xDown = evt.touches ? evt.touches[0].clientX : evt.clientX;
        }
        function handleEnd(evt) {
            if(!xDown) return;
            var xUp = evt.changedTouches ? evt.changedTouches[0].clientX : evt.clientX;
            var xDiff = xDown - xUp;
            if (Math.abs(xDiff) > 50) {
                if (xDiff > 0) movePage(1); else movePage(-1);
            }
            xDown = null;
        }

        function movePage(dir) {
            var next = currentPage + dir;
            if (next < 1) next = 3; if (next > 3) next = 1;
            var oldP = document.getElementById('p' + currentPage);
            var newP = document.getElementById('p' + next);
            oldP.className = "page " + (dir > 0 ? "exit-left" : "exit-right");
            newP.style.transition = "none";
            newP.className = "page " + (dir > 0 ? "exit-right" : "exit-left");
            setTimeout(function() {
                newP.style.transition = "all 0.6s cubic-bezier(0.19, 1, 0.22, 1)";
                newP.className = "page active-page";
                for(var i=1; i<=3; i++) document.getElementById('d'+i).className = "dot" + (i==next ? " dot-active" : "");
                currentPage = next;
            }, 50);
        }

        function getMeteo() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'https://api.open-meteo.com/v1/forecast?latitude=43.5157&longitude=1.5159&daily=temperature_2m_max&current_weather=true&timezone=Europe%2FParis', true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var d = JSON.parse(xhr.responseText);
                    document.getElementById('temp-main').innerHTML = "☀️ " + Math.round(d.current_weather.temperature) + "°";
                    var dNames = ["DIM", "LUN", "MAR", "MER", "JEU", "VEN", "SAM"];
                    var html = "";
                    for(var i=1; i<=4; i++) {
                        var dateObj = new Date(); dateObj.setDate(dateObj.getDate() + i);
                        html += "<div>" + dNames[dateObj.getDay()] + "<br><b>" + Math.round(d.daily.temperature_2m_max[i]) + "°</b></div>";
                    }
                    document.getElementById('forecast-data').innerHTML = html;
                }
            };
            xhr.send();
        }

        function toggleAlarm() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            var btn = document.getElementById('al-btn');
            if (!alarmActive) {
                alarmH = parseInt(document.getElementById('al-h').value);
                alarmM = parseInt(document.getElementById('al-m').value);
                alarmActive = true; btn.innerHTML = "ACTIF"; btn.className = "alarm-toggle-ios alarm-on";
            } else {
                alarmActive = false; btn.innerHTML = "ACTIVER"; btn.className = "alarm-toggle-ios alarm-off";
                stopAlarmNow();
            }
        }

        function startRinging() {
            isRinging = true; document.getElementById('stop-btn').style.display = "block";
            melodyInterval = setInterval(function() {
                var o = audioCtx.createOscillator(); var g = audioCtx.createGain();
                o.connect(g); g.connect(audioCtx.destination);
                o.frequency.value = 880; g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                o.start(); o.stop(audioCtx.currentTime + 0.8);
            }, 1000);
        }

        function stopAlarmNow() {
            isRinging = false; clearInterval(melodyInterval);
            document.getElementById('stop-btn').style.display = "none";
        }

        window.onload = function() {
            updateBackground(); updateClock(); getMeteo();
            setInterval(updateClock, 1000); setInterval(getMeteo, 600000);
        };
    </script>
</body>
</html>
