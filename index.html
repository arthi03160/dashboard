<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icone.png">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <title>StandBy 4S Master</title>
    
    <style>
        /* =========================================
           CORE STYLES & ANTI-HIGHLIGHT
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        input { 
            -webkit-user-select: auto !important; 
            user-select: auto !important; 
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            background: radial-gradient(circle at center, #1a2a3a 0%, #080a0c 70%, #000000 100%);
            color: #ffffff;
            font-family: 'Archivo Black', Arial, sans-serif;
            overflow: hidden;
            position: fixed;
        }

        /* =========================================
           ANIMATIONS UBUNTU STYLE
           ========================================= */
        #wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            -webkit-perspective: 1000px;
            perspective: 1000px;
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            -webkit-transform: scale(1.15);
            transform: scale(1.15);
            -webkit-transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            pointer-events: none;
            z-index: 1;
        }

        .active-page {
            opacity: 1 !important;
            visibility: visible !important;
            -webkit-transform: scale(1) !important;
            transform: scale(1) !important;
            z-index: 10;
            pointer-events: auto;
        }

        .exit-left {
            -webkit-transform: scale(0.6) translateX(-120%) !important;
            transform: scale(0.6) translateX(-120%) !important;
            opacity: 0 !important;
        }

        .exit-right {
            -webkit-transform: scale(0.6) translateX(120%) !important;
            transform: scale(0.6) translateX(120%) !important;
            opacity: 0 !important;
        }

        /* =========================================
           PAGE 1: CLOCK
           ========================================= */
        #clock {
            font-size: 78px; /* Ajusté pour le 4S */
            line-height: 1;
            text-shadow: 0 8px 25px rgba(0,0,0,0.7);
            letter-spacing: -2px;
        }

        #date {
            font-size: 15px;
            color: #a0aab4;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* =========================================
           BATTERY STATUS
           ========================================= */
        #status-bar-custom {
            position: fixed;
            top: 12px;
            right: 15px;
            display: flex;
            align-items: center;
            z-index: 1000;
        }

        #bat-level-text {
            font-size: 11px;
            margin-right: 5px;
            font-family: -apple-system, sans-serif;
            font-weight: 600;
        }

        #bat-shell {
            width: 22px;
            height: 10px;
            border: 1.2px solid rgba(255,255,255,0.4);
            border-radius: 3px;
            position: relative;
            padding: 1px;
        }

        #bat-shell::after {
            content: '';
            position: absolute;
            right: -3.5px;
            top: 2.5px;
            width: 2px;
            height: 3.5px;
            background: rgba(255,255,255,0.4);
            border-radius: 0 1px 1px 0;
        }

        #bat-fill {
            height: 100%;
            background: #30d158;
            border-radius: 1px;
            width: 0%;
            transition: width 0.5s ease;
        }

        /* =========================================
           PAGE 2: WEATHER
           ========================================= */
        .widget-box {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 15px;
            width: 85%;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            -webkit-backdrop-filter: blur(10px);
        }

        #temp-main { font-size: 34px; display: block; }
        #precip-info { color: #3498db; font-size: 13px; }
        
        .forecast-grid {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
        }

        .forecast-item { font-size: 10px; color: #888; }
        .forecast-temp { color: #fff; font-size: 13px; display: block; }

        /* =========================================
           PAGE 3: ALARM
           ========================================= */
        .alarm-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 25px;
            width: 85%;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .time-picker {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .time-picker input {
            background: #111;
            border: 1px solid #333;
            color: #fff;
            font-size: 26px;
            width: 55px;
            text-align: center;
            border-radius: 10px;
            padding: 8px;
            font-family: 'Archivo Black', sans-serif;
        }

        .alarm-toggle {
            padding: 12px 30px;
            border-radius: 15px;
            border: none;
            font-family: 'Archivo Black';
            font-size: 13px;
            text-transform: uppercase;
        }

        .alarm-off { background: #2c2c2e; color: #8e8e93; }
        .alarm-on { background: #34c759; color: #fff; }

        /* MODERNE STOP BUTTON (iOS 17 STYLE) */
        #stop-btn {
            display: none;
            position: fixed;
            bottom: 75px;
            left: 50%;
            -webkit-transform: translateX(-50%);
            transform: translateX(-50%);
            background: #ff3b30;
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            border: none;
            font-family: 'Archivo Black';
            font-size: 16px;
            z-index: 5000;
            box-shadow: 0 8px 20px rgba(255, 59, 48, 0.4);
        }

        /* =========================================
           FIXED NAVIGATION (IPHONE 4S)
           ========================================= */
        #nav-bar {
            position: fixed;
            bottom: 15px;
            width: 100%;
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 500;
        }

        .nav-arrow {
            width: 45px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: rgba(255,255,255,0.08);
        }

        #dots-wrapper {
            background: rgba(255, 255, 255, 0.12);
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 12px; /* Espacement corrigé pour les dots collés */
            -webkit-backdrop-filter: blur(8px);
        }

        .dot {
            width: 6px;
            height: 6px;
            background: rgba(255,255,255,0.25);
            border-radius: 10px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .dot-active {
            background: #ffffff !important;
            width: 18px; /* Pilule moins longue pour le 4S */
            box-shadow: 0 0 8px rgba(255,255,255,0.4);
        }
    </style>
</head>
<body onmousedown="handleStart(event)" onmouseup="handleEnd(event)" ontouchstart="handleStart(event)" ontouchend="handleEnd(event)">

    <div id="status-bar-custom">
        <div id="bat-level-text">--%</div>
        <div id="bat-shell"><div id="bat-fill"></div></div>
    </div>

    <button id="stop-btn" onclick="stopAlarmNow()">ARRÊTER</button>

    <div id="wrapper">
        <div class="page active-page" id="p1">
            <div id="clock">00:00</div>
            <div id="date">LUNDI 01 JANVIER</div>
        </div>

        <div class="page" id="p2">
            <div class="widget-box">
                <span id="temp-main">☀️ --°</span>
                <span id="precip-info">PLUIE: --%</span>
            </div>
            <div class="widget-box">
                <div class="forecast-grid" id="forecast-data">
                    </div>
            </div>
        </div>

        <div class="page" id="p3">
            <div class="alarm-card">
                <div class="time-picker">
                    <input type="number" id="al-h" value="07">
                    <span style="font-size:20px">:</span>
                    <input type="number" id="al-m" value="00">
                </div>
                <button id="al-btn" class="alarm-toggle alarm-off" onclick="toggleAlarm()">DÉSACTIVÉE</button>
                <div id="al-status" style="margin-top:10px; font-size:10px; color:#444">OFF</div>
            </div>
        </div>
    </div>

    <div id="nav-bar">
        <div class="nav-arrow" onclick="prevPage()">‹</div>
        <div id="dots-wrapper">
            <div class="dot dot-active" id="d1"></div>
            <div class="dot" id="d2"></div>
            <div class="dot" id="d3"></div>
        </div>
        <div class="nav-arrow" onclick="nextPage()">›</div>
    </div>

    <script type="text/javascript">
        var currentPage = 1, alarmH = -1, alarmM = -1, alarmActive = false, isRinging = false;
        var audioCtx = null, melodyInterval = null, xDown = null, yDown = null;

        function updateUI() {
            var now = new Date();
            var h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();

            if (alarmActive && h == alarmH && m == alarmM && s == 0 && !isRinging) startRinging();

            document.getElementById('clock').innerHTML = (h<10?"0"+h:h) + ":" + (m<10?"0"+m:m);
            var jours = ["DIMANCHE", "LUNDI", "MARDI", "MERCREDI", "JEUDI", "VENDREDI", "SAMEDI"];
            var mois = ["JANVIER", "FÉVRIER", "MARS", "AVRIL", "MAI", "JUIN", "JUILLET", "AOÛT", "SEPTEMBRE", "OCTOBRE", "NOVEMBRE", "DÉCEMBRE"];
            document.getElementById('date').innerHTML = jours[now.getDay()] + " " + now.getDate() + " " + mois[now.getMonth()];
            
            updateBattery();
        }

        function updateBattery() {
            var battery = navigator.battery || navigator.webkitBattery || navigator.mozBattery;
            if (battery) {
                var level = Math.round(battery.level * 100);
                document.getElementById('bat-level-text').innerHTML = (battery.charging ? "⚡ " : "") + level + "%";
                document.getElementById('bat-fill').style.width = level + "%";
                document.getElementById('bat-fill').style.background = level <= 20 ? "#ff3b30" : "#30d158";
            }
        }

        function handleStart(evt) {
            xDown = evt.touches ? evt.touches[0].clientX : evt.clientX;
            yDown = evt.touches ? evt.touches[0].clientY : evt.clientY;
        }

        function handleEnd(evt) {
            if (!xDown || !yDown) return;
            var xUp = evt.changedTouches ? evt.changedTouches[0].clientX : evt.clientX;
            var xDiff = xDown - xUp;
            if (Math.abs(xDiff) > 40) {
                if (xDiff > 0) nextPage(); else prevPage();
            }
            xDown = null; yDown = null;
        }

        function showPage(n, dir) {
            if (n === currentPage) return;
            var oldP = document.getElementById('p' + currentPage), newP = document.getElementById('p' + n);
            oldP.className = "page " + (dir === 'next' ? 'exit-left' : 'exit-right');
            newP.style.transition = 'none';
            newP.className = "page " + (dir === 'next' ? 'exit-right' : 'exit-left');
            setTimeout(function() {
                newP.style.transition = 'all 0.6s cubic-bezier(0.23, 1, 0.32, 1)';
                newP.className = "page active-page";
                for(var i=1; i<=3; i++) document.getElementById('d'+i).className = "dot" + (i==n ? " dot-active" : "");
            }, 50);
            currentPage = n;
        }

        function nextPage() { var n = currentPage + 1; if(n > 3) n = 1; showPage(n, 'next'); }
        function prevPage() { var n = currentPage - 1; if(n < 1) n = 3; showPage(n, 'prev'); }

        function toggleAlarm() {
            var btn = document.getElementById('al-btn');
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (!alarmActive) {
                alarmH = parseInt(document.getElementById('al-h').value);
                alarmM = parseInt(document.getElementById('al-m').value);
                alarmActive = true;
                btn.innerHTML = "ACTIVÉE"; btn.className = "alarm-toggle alarm-on";
                document.getElementById('al-status').innerHTML = "RÉVEIL À " + alarmH + ":" + (alarmM<10?"0"+alarmM:alarmM);
            } else {
                alarmActive = false;
                btn.innerHTML = "DÉSACTIVÉE"; btn.className = "alarm-toggle alarm-off";
                document.getElementById('al-status').innerHTML = "OFF";
                if(isRinging) stopAlarmNow();
            }
        }

        function startRinging() {
            isRinging = true;
            document.getElementById('stop-btn').style.display = "block";
            melodyInterval = setInterval(function() {
                var osc = audioCtx.createOscillator(); var g = audioCtx.createGain();
                osc.connect(g); g.connect(audioCtx.destination);
                osc.frequency.value = 880;
                g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                osc.start(); osc.stop(audioCtx.currentTime + 0.8);
            }, 1000);
        }

        function stopAlarmNow() {
            isRinging = false; clearInterval(melodyInterval);
            document.getElementById('stop-btn').style.display = "none";
        }

        function getMeteo() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'https://api.open-meteo.com/v1/forecast?latitude=43.5157&longitude=1.5159&daily=temperature_2m_max,precipitation_probability_max&current_weather=true&timezone=Europe%2FParis', true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    document.getElementById('temp-main').innerHTML = "☀️ " + Math.round(data.current_weather.temperature) + "°";
                    document.getElementById('precip-info').innerHTML = "PLUIE: " + data.daily.precipitation_probability_max[0] + "%";
                    var dArr = ["DIM", "LUN", "MAR", "MER", "JEU", "VEN", "SAM"], html = "";
                    for(var i=1; i<=4; i++) {
                        var d = new Date(); d.setDate(d.getDate() + i);
                        html += "<div class='forecast-item'>" + dArr[d.getDay()] + "<span class='forecast-temp'>" + Math.round(data.daily.temperature_2m_max[i]) + "°</span></div>";
                    }
                    document.getElementById('forecast-data').innerHTML = html;
                }
            }; xhr.send();
        }

        window.onload = function() {
            updateUI(); getMeteo();
            setInterval(updateUI, 1000);
            setInterval(getMeteo, 600000);
        };
    </script>
</body>
</html>
